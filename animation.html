/* 6 · keyboard shortcuts */
addEventListener("keydown",e=>{
  if(e.key==="Escape"){closeCmd();closeEcho();return;}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();openEcho();return;}
  if(/input|textarea/i.test(document.activeElement.tagName))return;
  if(e.key==="/"){e.preventDefault();openCmd();return;}
  if(e.key==="e"||e.key==="E"){e.preventDefault();openEcho();return;}
  const map={"1":"home","2":"create","3":"modes","4":"lens","5":"plan","6":"more"};
  if(map[e.key])go(map[e.key]);
  if(e.key==="t"||e.key==="T")toggleTheme();
});

/* ════════ CHARTS (palette validated with the dataviz validator) ════════
   light: #D14E80 #6E5AD0 #0A8C80 #B8781A  — all six checks PASS
   dark : #D2608E #7181DC #2CA595 #BE8A2C  — all six checks PASS
   Tritan ΔE sits in the 6–8 floor band, so every mark carries a direct
   label + 2px surface gap (required secondary encoding), plus a table view. */
const SERIES=()=>{const c=getComputedStyle(document.body);
  return[c.getPropertyValue("--s1").trim(),c.getPropertyValue("--s2").trim(),
         c.getPropertyValue("--s3").trim(),c.getPropertyValue("--s4").trim()];}
function donut(data,size){
  const S4=SERIES(),total=data.reduce((n,d)=>n+d.v,0);
  if(!total)return `<div class="empty">No data yet.</div>`;
  const R=size/2,r=R-13,ir=r*.6,gap=.028;let ang=-Math.PI/2,paths="";
  data.forEach((d,i)=>{
    const frac=d.v/total; if(!frac)return;
    const a0=ang+gap/2,a1=ang+frac*2*Math.PI-gap/2;ang+=frac*2*Math.PI;
    if(a1<=a0)return;
    const big=(a1-a0)>Math.PI?1:0;
    const p=(rad,a)=>[R+rad*Math.cos(a),R+rad*Math.sin(a)];
    const[x1,y1]=p(r,a0),[x2,y2]=p(r,a1),[x3,y3]=p(ir,a1),[x4,y4]=p(ir,a0);
    paths+=`<path d="M${x1} ${y1}A${r} ${r} 0 ${big} 1 ${x2} ${y2}L${x3} ${y3}A${ir} ${ir} 0 ${big} 0 ${x4} ${y4}Z"
      fill="${S4[i%4]}"><title>${esc(d.k)}: ${d.v}</title></path>`;
    const mid=(a0+a1)/2,[lx,ly]=p((r+ir)/2*1.02,mid);
    if(frac>0.07)paths+=`<text x="${lx}" y="${ly+4}" text-anchor="middle" font-size="12" font-weight="700"
      fill="#fff" stroke="rgba(0,0,0,.45)" stroke-width="2.5" style="paint-order:stroke">${d.v}</text>`;
  });
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img">
    ${paths}<text x="${R}" y="${R-2}" text-anchor="middle" font-size="21" font-weight="800"
      fill="currentColor">${total}</text>
    <text x="${R}" y="${R+14}" text-anchor="middle" font-size="9" fill="currentColor" opacity=".6">ITEMS</text></svg>`;
}
function bars(data){
  const S4=SERIES(),max=Math.max(...data.map(d=>d.v),1);
  return data.map((d,i)=>`
    <div style="display:flex;align-items:center;gap:9px;margin-bottom:7px">
      <span style="width:88px;font-size:11px;color:var(--muted);text-align:right;flex-shrink:0">${esc(d.k)}</span>
      <div style="flex:1;height:15px;background:var(--card2);border-radius:5px;overflow:hidden">
        <div style="width:${(d.v/max*100)||0}%;height:100%;background:${S4[i%4]};border-radius:0 5px 5px 0;
          transition:width .7s cubic-bezier(.2,.8,.25,1)"></div></div>
      <b style="width:24px;font-size:12px;font-variant-numeric:tabular-nums">${d.v}</b>
    </div>`).join("");
}
function legend(data){const S4=SERIES();
  return `<div class="legend">${data.map((d,i)=>
    `<span><i style="background:${S4[i%4]}"></i>${esc(d.k)}</span>`).join("")}</div>`;}

async function pairBT(){const r=await DEVICE.pairBluetooth();
  toast(r.ok?"Connected <b>"+esc(DEVICE.live.bt)+"</b>":"Bluetooth: "+esc(r.reason));render();}
function importICS(input){
  const f=input.files&&input.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    const txt=String(rd.result||""),evs=[];
    txt.split(/BEGIN:VEVENT/).slice(1).forEach(chunk=>{
      const g=re=>{const m=chunk.match(re);return m?m[1].trim():null;};
      const sum=g(/SUMMARY:(.+)/),st=g(/DTSTART[^:]*:(\d{8}T\d{6})/),en=g(/DTEND[^:]*:(\d{8}T\d{6})/);
      if(sum&&st){
        const hm=x=>x?x.slice(9,11)+":"+x.slice(11,13):null;
        evs.push({title:sum,start:hm(st),end:hm(en)||hm(st)});
      }
    });
    if(!evs.length){toast("No events found in that .ics file");return;}
    S.realCalendar=evs;
    demoCalendar.length=0; evs.slice(0,8).forEach(e=>demoCalendar.push(e));
    log("ok","Imported "+evs.length+" real calendar event(s) from "+f.name+
      ". The planner now uses your actual schedule.");
    toast("Imported <b>"+evs.length+"</b> real event(s)");
    persist(); render();
  };
  rd.readAsText(f);
}

  const total=S.log.length;

  const share=total?Math.round(asked/total*100):0;
  const echoRuns=S.log.filter(l=>l.text.startsWith("Echo ")).length;
  const learned=[];

  if(S.automations.length){const c={};S.automations.forEach(a=>c[a.autonomy]=(c[a.autonomy]||0)+1);
    learned.push(["Autonomy you prefer",Object.entries(c).sort((a,b)=>b[1]-a[1])[0][0],
      "across "+S.automations.length+" automation(s)"]);}
  if(S.memoryPrefs.length)learned.push(["Preferences kept",S.memoryPrefs.length,

  return `

  </div>

  <div class="ig">
    <div class="igcard"><div class="ign">${echoRuns}</div><div class="igl">Echo actions</div>

    persist();render();return;
  }
  const cap=DEVICE.caps[k];
  if(cap&&DEVICE.isReal(k)){                // REAL permission demand
    const r=await DEVICE.request(k);
    if(!r.ok){
      S.caps[k]=0;

        " Nothing that needs it will run.");

    toast("Granted <b>"+esc(cap.label)+"</b> — "+esc(r.detail||"live"));

  }

/** Real capture: opens the actual camera, grabs a frame, and (where the
 *  browser supports TextDetector) reads real text off it. Otherwise it says
 *  plainly that it captured an image but could not read it. */
async function scanImage(){
  if(!S.caps.camera){toast("Camera is off in Control — nothing was captured.");return;}
  if(DEVICE.supported("camera")&&DEVICE.secure){
    try{
      const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
      const v=document.createElement("video");v.srcObject=stream;v.muted=true;v.playsInline=true;
      await v.play(); await new Promise(r=>setTimeout(r,450));
      const c=document.createElement("canvas");
      c.width=v.videoWidth||640;c.height=v.videoHeight||480;
      c.getContext("2d").drawImage(v,0,0,c.width,c.height);
      stream.getTracks().forEach(t=>t.stop());
      let text="";
      if("TextDetector" in window){
        try{const det=new window.TextDetector();
          const blocks=await det.detect(c);
          text=blocks.map(b=>b.rawValue).join(" ");}catch(e){}
      }
      if(text.trim()){
        const item={id:"cam"+S.seq,source:"camera",sender:null,text:text.trim().slice(0,240)};
        const commit=extractCommitment(item);
        if(commit){
          S.commitments.push({id:S.seq++,...commit,src:"camera",status:"candidate"});
          log("ok","Camera intelligence [REAL] captured "+c.width+"×"+c.height+
            " and read a commitment from the image text.");
          toast("Read a commitment from the camera");
        }else{
          log("info","Camera intelligence [REAL] captured "+c.width+"×"+c.height+
            " and read text, but found no commitment in it.");
          toast("Captured — no commitment found in that text");
        }
        persist();render();return;
      }
      log("info","Camera intelligence [REAL] captured a "+c.width+"×"+c.height+" frame. "+
        "This browser has no on-device text recognition, so nothing was extracted from it — "+
        "using the prepared sample instead so you can see the flow.");
      toast("Captured a real frame · no OCR in this browser");
    }catch(e){
      // Honest about the real failure, then fall back to the prepared sample so the
      // capability is still demonstrable — and labelled as a sample (SRS §5).
      log("err","Camera capture failed: "+(e&&e.message||"denied")+
        ". Falling back to the prepared sample poster, clearly labelled.");
      toast("Camera unavailable — using the sample poster");
    }
  }
  if(S.commitments.some(c=>c.src==="camera")){toast("Sample poster already scanned");return;}
  S.commitments.push({id:S.seq++,task:"register for Hackathon 2026 finals",person:"Event Cell",
    deadline:"Fri 21 Aug 05:00 pm",confidence:.82,src:"camera",
    raw:"[Poster image] HACKATHON 2026 — Team registrations close Friday 5 PM, Auditorium B",status:"candidate"});
  log("info","Camera intelligence [SAMPLE] extracted a date/task from the prepared poster (FR-14).",1);
  toast("Extracted a commitment from the sample poster");persist();render();
}

/* soft WebAudio blip — every sound follows a tap, so no autoplay issues */
let _ac=null;
function blip(freq,dur){
  if(!S.sound)return;
  try{
    _ac=_ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=_ac.createOscillator(),g=_ac.createGain();
    o.type="sine"; o.frequency.value=freq||520;
    g.gain.setValueAtTime(0.0001,_ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.055,_ac.currentTime+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,_ac.currentTime+(dur||0.22));
    o.connect(g);g.connect(_ac.destination);o.start();o.stop(_ac.currentTime+(dur||0.22));
  }catch(e){}
}

    if(isNaN(target)){return;}
    if(reduced||target===0){el.textContent=target;return;}
    const dur=550,t0=performance.now();
    function step(t){
      const p=Math.min(1,(t-t0)/dur),eased=1-Math.pow(1-p,3);

/* ══════════════════════════════════════════════════════════════════════
   BACKEND INTEGRATION — one origin, graceful degradation.
   When the FastAPI service is reachable, the four AI functions run there
   (the same validated engine the Android app uses). When it is not, the
   built-in on-device engine answers instead and the UI says which ran.
   ══════════════════════════════════════════════════════════════════════ */
const API={
  base:(location.protocol==="file:")?"http://localhost:8000":"",   // same origin when served
  online:null, version:null, llm:null, lastCheck:0,
  url(p){return (this.base||"")+p;},
  async health(){
    try{
      const c=new AbortController(),t=setTimeout(()=>c.abort(),2500);
      const r=await fetch(this.url("/health"),{signal:c.signal}); clearTimeout(t);
      if(!r.ok)throw new Error("status "+r.status);
      const d=await r.json();
      const was=this.online;
      this.online=d.status==="ok"; this.version=d.version; this.llm=d.llm_mode;
      this.lastCheck=Date.now();
      if(was===false&&this.online)log("ok","AI backend reachable again (v"+d.version+", "+d.llm_mode+" engine).");
      if(was===true&&!this.online)log("err","AI backend stopped responding — falling back to the on-device engine.");
      return this.online;
    }catch(e){
      const was=this.online; this.online=false; this.lastCheck=Date.now();
      if(was===true)log("err","AI backend unreachable — on-device engine is handling everything.");
      return false;
    }
  },
  async post(path,body,ms){
    const c=new AbortController(),t=setTimeout(()=>c.abort(),ms||6000);
    try{
      const r=await fetch(this.url(path),{method:"POST",signal:c.signal,
        headers:{"content-type":"application/json"},body:JSON.stringify(body)});
      clearTimeout(t);
      if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error((e.error&&e.error.message)||("status "+r.status));}
      return await r.json();
    }catch(e){clearTimeout(t);this.online=false;throw e;}
  },
};

/* ── the four AI functions: backend first, on-device fallback ─────────── */
async function smartParse(text){
  if(API.online!==false){
    try{
      const d=await API.post("/ai/parse",{text});
      const i=d.intent;
      return{valid:true,engine:"backend",rejected:d.rejected_actions||[],
        intent:{trigger:i.trigger,actions:i.actions,
          required_permissions:i.required_permissions||[],
          requires_confirmation:!!i.requires_confirmation,
          confidence:i.confidence,summary:i.summary}};
    }catch(e){ /* fall through */ }
  }
  const v=validateIntent(parseNL(text));
  return v.valid?{valid:true,engine:"on-device",rejected:v.rejected,intent:v.intent}
                :{valid:false,engine:"on-device",reason:v.reason};
}

/* ══════════════════════════════════════════════════════════════════════
   DEVICE LAYER — REAL hardware / OS access, honestly scoped.
   Every capability below states whether it is genuinely available in a
   browser. Where a real API exists we REQUEST IT and use it live.
   Where none exists we say so instead of pretending (SRS §15, spec §58).
   ══════════════════════════════════════════════════════════════════════ */
const DEVICE={
  secure:(location.protocol==="https:"||location.hostname==="localhost"||location.hostname==="127.0.0.1"),
  caps:{
    location:{label:"Location",grade:"real",perm:"geolocation",
      why:"Real GPS. Drives arrive/leave triggers and live geofences.",
      supported:()=>"geolocation" in navigator},
    notifications:{label:"Notifications",grade:"partial",perm:"notifications",
      why:"EchoOS can raise real system notifications. No browser can READ other apps' notifications — that part stays a labelled simulation.",
      supported:()=>"Notification" in window},
    connectivity:{label:"Bluetooth & network",grade:"real",perm:null,
      why:"Real Bluetooth device connect/disconnect and real online/offline state.",
      supported:()=>!!navigator.bluetooth||"onLine" in navigator},
    camera:{label:"Camera",grade:"real",perm:"camera",
      why:"Real capture, used to read dates and tasks off a photo.",
      supported:()=>!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)},
    microphone:{label:"Microphone",grade:"real",perm:"microphone",
      why:"Real voice input for Echo.",
      supported:()=>!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)},
    calendar:{label:"Calendar",grade:"import",perm:null,
      why:"Browsers have no calendar API. Import a real .ics file and EchoOS plans around it.",
      supported:()=>true},
    messaging:{label:"Messaging",grade:"handoff",perm:null,
      why:"Opens your real share sheet. EchoOS will never send a message silently.",
      supported:()=>!!navigator.share},
    dnd:{label:"Do Not Disturb",grade:"none",perm:null,
      why:"No browser API can silence a phone. Focus/silent actions are simulated and labelled.",
      supported:()=>false},
    settings:{label:"Device settings",grade:"none",perm:null,
      why:"No browser API can change system settings. Simulated and labelled.",
      supported:()=>false},
  },
  state:{},        // live permission state per capability
  live:{online:navigator.onLine,battery:null,bt:null,coords:null,accuracy:null,place:null},
  watchId:null, wakeLock:null,

  grade(k){return this.caps[k]?this.caps[k].grade:"none";},
  isReal(k){const g=this.grade(k);return g==="real"||g==="partial"||g==="import"||g==="handoff";},
  supported(k){const c=this.caps[k];return !!(c&&c.supported());},

  /** live permission state without prompting */
  async refresh(){
    for(const k in this.caps){
      const c=this.caps[k];
      if(!c.supported()){this.state[k]="unsupported";continue;}
      if(k==="notifications"){this.state[k]=Notification.permission==="default"?"prompt":Notification.permission;continue;}
      if(!c.perm){this.state[k]="ready";continue;}
      try{
        if(navigator.permissions&&navigator.permissions.query){
          const r=await navigator.permissions.query({name:c.perm});
          this.state[k]=r.state;
          r.onchange=()=>{this.state[k]=r.state;if(typeof render==="function")render();};
        }else this.state[k]="prompt";
      }catch(e){this.state[k]="prompt";}
    }
    this.live.online=navigator.onLine;
    return this.state;
  },

  /** ACTUALLY ask the OS/browser for the permission this app wants */
  async request(k){
    const c=this.caps[k]; if(!c)return{ok:false,reason:"unknown capability"};
    if(!c.supported())return{ok:false,reason:"This browser has no API for "+c.label+"."};
    if(!this.secure&&(k==="location"||k==="camera"||k==="microphone"||k==="connectivity"))
      return{ok:false,reason:"Needs a secure context — open EchoOS over https:// or http://localhost."};
    try{
      if(k==="location"){
        startGeofencing();                       // start the real watch straight away
        const first=await new Promise(res=>{
          let done=false; const finish=v=>{if(!done){done=true;res(v);}};
          try{
            navigator.geolocation.getCurrentPosition(pos=>finish(pos),()=>{},
              {enableHighAccuracy:true,timeout:8000,maximumAge:30000});
          }catch(e){}
          const iv=setInterval(()=>{if(this.live.coords){clearInterval(iv);finish(null);}},200);
          setTimeout(()=>{clearInterval(iv);finish(null);},9000);
        });
        if(first){this.live.coords={lat:first.coords.latitude,lng:first.coords.longitude};
                  this.live.accuracy=Math.round(first.coords.accuracy);}
        try{
          if(navigator.permissions&&navigator.permissions.query){
            const q=await navigator.permissions.query({name:"geolocation"});
            if(q.state!=="prompt")this.state[k]=q.state;
          }
        }catch(e){}
        if(this.state[k]==="denied"){stopGeofencing();
          return{ok:false,reason:"Your device denied location access."};}
        this.state[k]="granted";
        return this.live.coords
          ?{ok:true,detail:"Fix acquired ±"+(this.live.accuracy||"?")+" m"}
          :{ok:true,detail:"Access granted — waiting for the first fix"};
      }
      if(k==="notifications"){
        const r=await Notification.requestPermission();
        this.state[k]=r==="default"?"prompt":r;
        return r==="granted"?{ok:true,detail:"Real notifications enabled"}
                            :{ok:false,reason:"You declined notifications."};
      }
      if(k==="camera"||k==="microphone"){
        const st=await navigator.mediaDevices.getUserMedia(k==="camera"?{video:true}:{audio:true});
        st.getTracks().forEach(t=>t.stop());
        this.state[k]="granted";
        return{ok:true,detail:"Hardware confirmed"};
      }
      if(k==="connectivity"){
        if(!navigator.bluetooth){this.state[k]="ready";
          return{ok:true,detail:"Network state live; Web Bluetooth unavailable in this browser."};}
        this.state[k]="ready";
        return{ok:true,detail:"Ready — use “Pair a device” to connect real hardware."};
      }
      if(k==="calendar"){this.state[k]="ready";return{ok:true,detail:"Import an .ics file to load real events."};}
      if(k==="messaging"){this.state[k]=navigator.share?"ready":"unsupported";
        return navigator.share?{ok:true,detail:"Share sheet available"}
                              :{ok:false,reason:"This browser has no Web Share API."};}
      return{ok:false,reason:c.why};
    }catch(e){
      this.state[k]="denied";
      return{ok:false,reason:(e&&e.message)||"Permission denied."};
    }
  },

  /** real Bluetooth pairing — drives Driving Mode for real */
  async pairBluetooth(){
    if(!navigator.bluetooth)return{ok:false,reason:"Web Bluetooth isn't available in this browser."};
    try{
      const dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true});
      this.live.bt=dev.name||"Bluetooth device";
      dev.addEventListener("gattserverdisconnected",()=>{
        DEVICE.live.bt=null;
        fireContext("bluetooth_disconnect",dev.name||"device",{real:true});
      });
      try{ if(dev.gatt)await dev.gatt.connect(); }catch(e){}
      fireContext("bluetooth_connect",dev.name||"device",{real:true});
      return{ok:true,detail:"Connected to "+this.live.bt};
    }catch(e){return{ok:false,reason:(e&&e.message)||"No device selected."};}
  },

  /** real system notification (not a toast) */
  notify(title,body){
    if(!("Notification" in window)||Notification.permission!=="granted")return false;
    try{ new Notification(title,{body,icon:ECHO_ICON_URI,tag:"echoos"}); return true; }
    catch(e){ return false; }
  },

  async keepAwake(on){
    try{
      if(on&&"wakeLock" in navigator&&!this.wakeLock){this.wakeLock=await navigator.wakeLock.request("screen");}
      else if(!on&&this.wakeLock){await this.wakeLock.release();this.wakeLock=null;}
      return true;
    }catch(e){return false;}
  },
};
const ECHO_ICON_URI="data:image/svg+xml,"+encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192"><rect width="192" height="192" rx="42" fill="%23080A0F"/><circle cx="96" cy="96" r="40" fill="none" stroke="%238B5CF6" stroke-width="10"/><circle cx="96" cy="96" r="12" fill="%2322D3EE"/></svg>');

/* ═══ REAL GEOFENCING ═══════════════════════════════════════════════════
   Places are pinned from the user's ACTUAL position, then watchPosition
   fires genuine location_enter / location_exit events into the SAME
   automation engine the simulated demo uses. */
const GEO={radius:150,places:{}};   // {college:{lat,lng,r}}
function haversine(a,b){
  const R=6371000,toRad=x=>x*Math.PI/180;
  const dLat=toRad(b.lat-a.lat),dLng=toRad(b.lng-a.lng);
  const s=Math.sin(dLat/2)**2+Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
function pinPlace(name){
  if(!DEVICE.live.coords){toast("No position yet — grant Location first");return false;}
  GEO.places[name]={...DEVICE.live.coords,r:GEO.radius};
  persist();
  log("ok","Pinned your real position as “"+name+"” (±"+(DEVICE.live.accuracy||"?")+" m). "+
    "Geofence radius "+GEO.radius+" m.");
  toast("Pinned <b>"+esc(name)+"</b> at your real location");
  evaluateGeofences();                     // you are standing in it right now
  render(); return true;
}
/** Compares the live position against every pinned place and fires real
 *  enter/exit transitions. Called by the position watch and after pinning. */
function evaluateGeofences(){
  if(!DEVICE.live.coords)return;
  let inside=null;
  for(const [name,pl] of Object.entries(GEO.places)){
    if(haversine(DEVICE.live.coords,pl)<=pl.r){inside=name;break;}
  }
  if(inside!==DEVICE.live.place){
    const left=DEVICE.live.place;
    DEVICE.live.place=inside;
    if(left)fireContext("location_exit",left,{real:true});
    if(inside)fireContext("location_enter",inside,{real:true});
    persist();
  }
}
function startGeofencing(){
  if(!("geolocation" in navigator)||DEVICE.watchId!=null)return;
  DEVICE.watchId=navigator.geolocation.watchPosition(pos=>{
    DEVICE.live.coords={lat:pos.coords.latitude,lng:pos.coords.longitude};
    DEVICE.live.accuracy=Math.round(pos.coords.accuracy);
    evaluateGeofences();
    if(S.tab==="more"&&S.moreSeg==="ctrl")render();
  },err=>{
    log("err","Location watch stopped: "+(err&&err.message||"unknown")+". No position events until it resumes.");
  },{enableHighAccuracy:true,maximumAge:5000,timeout:20000});
}
function stopGeofencing(){
  if(DEVICE.watchId!=null){navigator.geolocation.clearWatch(DEVICE.watchId);DEVICE.watchId=null;}
  DEVICE.live.place=null;
}

/* ═══ REAL TIME SCHEDULER ═══════════════════════════════════════════════ */
const SCHED={timers:{}};
function scheduleTimeTriggers(){
  Object.values(SCHED.timers).forEach(clearTimeout); SCHED.timers={};
  const times=new Set();
  S.automations.filter(a=>a.status==="active"&&a.intent.trigger.type==="time_schedule")
    .forEach(a=>times.add(a.intent.trigger.time));
  MODES.filter(m=>m.trigger.type==="time_schedule").forEach(m=>times.add(m.trigger.time));
  times.forEach(hhmm=>{
    if(!hhmm)return;
    const [h,mi]=hhmm.split(":").map(Number);
    const now=new Date(),next=new Date();
    next.setHours(h,mi,0,0); if(next<=now)next.setDate(next.getDate()+1);
    const delay=next-now;
    if(delay>0&&delay<86400000)
      SCHED.timers[hhmm]=setTimeout(()=>{fireContext("time_schedule",hhmm,{real:true});
        scheduleTimeTriggers();},delay);
  });
}

/* ═══ REAL AMBIENT SIGNALS ═══════════════════════════════════════════════ */
function startAmbientSignals(){
  addEventListener("online",()=>{DEVICE.live.online=true;
    log("info","Network came back online (real signal).");render();});
  addEventListener("offline",()=>{DEVICE.live.online=false;
    log("info","Network went offline (real signal). Local features keep working.");render();});
  if(navigator.getBattery)navigator.getBattery().then(b=>{
    const upd=()=>{DEVICE.live.battery={level:Math.round(b.level*100),charging:b.charging};
      if(S.tab==="more"&&S.moreSeg==="ctrl")render();};
    upd(); b.addEventListener("levelchange",upd); b.addEventListener("chargingchange",upd);
  }).catch(()=>{});
  document.addEventListener("visibilitychange",()=>{
    if(!document.hidden&&DEVICE.watchId!=null)scheduleTimeTriggers();
  });
}

/* ═══ REAL PERSISTENCE — the OS keeps running across reloads ═══════════ */
const STORE_KEY="echoos.v2.state";
let _persistT=null;
function persist(){
  clearTimeout(_persistT);
  _persistT=setTimeout(()=>{
    try{
      localStorage.setItem(STORE_KEY,JSON.stringify({
        v:2,user:S.user,automations:S.automations,commitments:S.commitments,
        patterns:S.patterns,memoryPrefs:S.memoryPrefs,caps:S.caps,log:S.log.slice(0,200),
        events:S.events.slice(0,200),theme:S.theme,palette:S.palette,sound:S.sound,
        modeState,modeAutonomy,places:GEO.places,seq:S.seq,plan:S.plan,
      }));
    }catch(e){}
  },250);
}
function restore(){
  try{
    const raw=localStorage.getItem(STORE_KEY); if(!raw)return false;
    const d=JSON.parse(raw); if(!d||d.v!==2)return false;
    Object.assign(S,{user:d.user||null,automations:d.automations||[],commitments:d.commitments||[],
      patterns:d.patterns||[],memoryPrefs:d.memoryPrefs||S.memoryPrefs,caps:d.caps||S.caps,
      log:d.log||[],events:d.events||[],theme:d.theme||"ambient",palette:d.palette||"aurora",
      sound:d.sound!==false,seq:d.seq||1,plan:d.plan||null});
    Object.assign(modeState,d.modeState||{});
    Object.assign(modeAutonomy,d.modeAutonomy||{});
    Object.assign(GEO.places,d.places||{});
    document.body.dataset.theme=S.theme; document.body.dataset.palette=S.palette;
    return true;
  }catch(e){return false;}
}
function wipeStore(){try{localStorage.removeItem(STORE_KEY);}catch(e){}}

  verify(a){const m=modeById(a.id);
    return{on:!!modeState[m.id],rows:m.actions.map(x=>({k:x.type.replace(/_/g," "),ok:!!modeState[m.id]}))};},
  explainAfter(a){const m=modeById(a.id);
    return[{t:"text",v:"What changed:"},
      {t:"list",items:m.actions.map(x=>({title:x.type.replace(/_/g," "),
        meta:"needs "+(ACTIONS[x.type].perm||"no permission")+" · simulated and logged"}))},
      {t:"text",v:'<span class="dim">Every one of those is in the activity log with its reason.</span>'}];}},

deactivate_mode:{cap:"modes",kind:"write",

change_mode_autonomy:{cap:"modes",kind:"write",

approve_pending:{cap:"automations",kind:"write",title:()=>"Approve pending automations",

create_automation:{cap:"automations",kind:"write",

change_automation_autonomy:{cap:"automations",kind:"write",

enable_automation:{cap:"automations",kind:"write",title:a=>"Enable automation",perms:()=>[],autonomy:()=>"automatic",

disable_automation:{cap:"automations",kind:"write",title:a=>"Disable automation",perms:()=>[],autonomy:()=>"confirm",

delete_automation:{cap:"automations",kind:"destructive",title:a=>"Delete automation",perms:()=>[],autonomy:()=>"confirm",

/* ── EchoLens ────────────────────────────────────────────────── */
scan_notifications:{cap:"echolens",kind:"write",title:()=>"Scan notifications",
  perms:()=>["notifications"],autonomy:()=>"automatic",
  plan(){return["Check notification access",
    (API.online?"Send permitted items to the AI backend":"Run the on-device extractor"),
    "Sort by priority","Extract commitment candidates"];},
  async runAsync(){await smartLens();},
  run(){runLens({sync:true});
    const commits=S.commitments.filter(c=>c.status==="candidate");
    ECHO.ctx.list=commits.map(c=>({kind:"commitment",id:c.id,name:c.task}));ECHO.ctx.kind="commitment";
    const need=lensItems.filter(i=>i.pri==="needs_attention").length,
          later=lensItems.filter(i=>i.pri==="later").length,
          low=lensItems.filter(i=>i.pri==="low").length;
    const top=commits.slice().sort((a,b)=>b.confidence-a.confidence)[0];
    return{ok:true,blocks:[
      {t:"text",v:"Scanned <b>"+lensItems.length+"</b> permitted notifications."},
      {t:"metrics",items:[{v:need,l:"needs attention"},{v:later,l:"later"},{v:low,l:"low"},
        {v:commits.length,l:"commitments"}]},
      ...(top?[{t:"text",v:"Most important: <b>"+esc(top.task)+"</b>"+
        (top.deadline?" — due "+esc(top.deadline):"")+"."}]:[]),
      ...(commits.length?[{t:"list",title:"Commitment candidates",items:commits.map((c,i)=>({
        title:c.task,meta:(c.person?c.person+" · ":"")+(c.deadline||"no deadline")+
          " · "+Math.round(c.confidence*100)+"% confidence"}))}]:[]),
      {t:"actions",items:[{label:"Open EchoLens",cmd:"open echolens"},
        ...(commits.length?[{label:"Accept the first",cmd:"accept the first commitment"}]:[])]}]};},
  verify(){return{on:lensItems.length>0,rows:[{k:"Sources read",ok:lensItems.length>0},
    {k:"Originals unchanged",ok:true}]};}},

scan_image:{cap:"echolens",kind:"write",title:()=>"Scan image",perms:()=>["camera"],autonomy:()=>"automatic",
  plan(){return["Check camera access","Read the provided image [SIMULATED]","Extract dates and tasks"];},
  run(){scanImage();const c=S.commitments.find(x=>x.src==="camera");
    return{ok:!!c,blocks:c?[{t:"text",v:"Extracted <b>"+esc(c.task)+"</b>"+(c.deadline?" — due "+esc(c.deadline):"")+
      " from the image. <span class=\"dim\">Simulated capture, clearly labelled.</span>"}]:[]};},
  verify(){const c=S.commitments.find(x=>x.src==="camera");return{on:!!c,rows:[{k:"Commitment extracted",ok:!!c}]};}},

list_commitments:{cap:"echolens",kind:"read",title:()=>"List commitments",
  run(){const all=S.commitments.filter(c=>c.status!=="dismissed");
    ECHO.ctx.list=all.map(c=>({kind:"commitment",id:c.id,name:c.task}));ECHO.ctx.kind="commitment";
    if(!all.length)return{ok:true,blocks:[
      {t:"text",v:"No commitments yet — I haven't scanned anything you've permitted."},
      {t:"actions",items:[{label:"Scan notifications",cmd:"scan my notifications"}]}]};
    const acc=all.filter(c=>c.status==="accepted");
    return{ok:true,blocks:[
      {t:"text",v:"<b>"+all.length+"</b> commitment"+(all.length>1?"s":"")+
        (acc.length?" — "+acc.length+" accepted":" — none accepted yet")+"."},
      {t:"cards",items:all.map(c=>({title:c.task,
        meta:(c.person?c.person+" · ":"")+(c.deadline||"no deadline")+
          " · "+Math.round(c.confidence*100)+"% confidence",
        tag:c.status,tagClass:c.status==="accepted"?"ok":c.status==="candidate"?"pri":"",
        conf:c.confidence,
        actions:c.status==="candidate"
          ?[{label:"Accept",cmd:"accept commitment "+c.task,style:""},
            {label:"Dismiss",cmd:"dismiss commitment "+c.task}]
          :[]}))},
      {t:"actions",items:[{label:"Open EchoLens",cmd:"open echolens"},
        {label:"Plan around these",cmd:"plan my day"}]}]};}},

accept_commitment:{cap:"echolens",kind:"write",title:a=>"Accept commitment",perms:()=>[],autonomy:()=>"automatic",
  plan(a){const c=S.commitments.find(x=>x.id===a.id);return["Remember “"+(c?c.task:"")+"”","Make it available to the planner"];},
  run(a){const c=S.commitments.find(x=>x.id===a.id);if(!c)return{ok:false,blocks:[{t:"text",v:"I couldn't find that commitment."}]};
    setCommit(c.id,"accepted");return{ok:c.status==="accepted",blocks:[]};},
  verify(a){const c=S.commitments.find(x=>x.id===a.id);
    return{on:c&&c.status==="accepted",rows:[{k:"Remembered: "+(c?c.task:""),ok:c&&c.status==="accepted"}]};}},

dismiss_commitment:{cap:"echolens",kind:"destructive",title:a=>"Dismiss commitment",perms:()=>[],autonomy:()=>"confirm",
  plan(a){const c=S.commitments.find(x=>x.id===a.id);return["Dismiss “"+(c?c.task:"")+"”","It won't be remembered"];},
  run(a){const c=S.commitments.find(x=>x.id===a.id);if(!c)return{ok:false,blocks:[{t:"text",v:"I couldn't find that commitment."}]};
    setCommit(c.id,"dismissed");return{ok:c.status==="dismissed",blocks:[]};},
  verify(a){const c=S.commitments.find(x=>x.id===a.id);

/* ── planner ─────────────────────────────────────────────────── */
generate_plan:{cap:"planner",kind:"write",title:()=>"Plan the day",perms:()=>["calendar"],autonomy:()=>"automatic",
  plan(){return["Check calendar access","Read calendar, tasks and accepted commitments",
    (API.online?"Plan on the AI backend":"Plan on-device"),"Respect fixed events and deadlines"];},
  async runAsync(){await smartPlan();},
  run(){if(!S.plan)S.plan=buildPlan();
    const p=S.plan,com=p.blocks.filter(b=>b.kind==="commitment"),task=p.blocks.filter(b=>b.kind==="task");
    return{ok:!!p,blocks:[
      {t:"text",v:"Built your plan for <b>"+esc(p.date)+"</b>."},
      {t:"metrics",items:[{v:p.blocks.filter(b=>b.kind==="fixed").length,l:"fixed"},
        {v:com.length,l:"commitments"},{v:task.length,l:"tasks"},{v:p.notes.length,l:"notes"}]},
      {t:"list",items:p.blocks.slice(0,7).map(b=>({title:b.start+"–"+b.end+"  "+b.title,
        meta:b.kind+(b.editable?" · editable":" · fixed")}))},
      ...(p.notes.length?[{t:"text",v:'<span class="dim">'+esc(p.notes[0])+"</span>"}]:[]),
      {t:"actions",items:[{label:"Open Planner",cmd:"open planner"}]}]};},
  verify(){return{on:!!S.plan,rows:[{k:"Plan generated",ok:!!S.plan},
    {k:"Fixed events preserved",ok:!!S.plan&&S.plan.blocks.some(b=>b.kind==="fixed")}]};}},

show_plan:{cap:"planner",kind:"read",title:()=>"Show plan",
  run(){if(!S.plan)return{ok:true,blocks:[
      {t:"text",v:"You don't have a plan yet."},
      {t:"actions",items:[{label:"Plan my day",cmd:"plan my day"}]}]};
    const p=S.plan;
    return{ok:true,blocks:[{t:"text",v:"<b>"+esc(p.date)+"</b> — "+p.blocks.length+" blocks."},
      {t:"list",items:p.blocks.map(b=>({title:b.start+"–"+b.end+"  "+b.title,meta:b.kind}))},
      ...(p.notes.length?[{t:"text",v:'<span class="dim">'+p.notes.map(esc).join("<br>")+"</span>"}]:[]),
      {t:"actions",items:[{label:"Open Planner",cmd:"open planner"}]}]};}},

priority_tasks:{cap:"planner",kind:"read",title:()=>"Priorities",
  run(){
    const due=S.commitments.filter(c=>c.status==="accepted"&&c.deadline);
    const first=S.plan?S.plan.blocks.find(b=>b.kind==="commitment"||b.kind==="task"):null;
    const b=[];
    if(due.length)b.push({t:"text",v:"<b>"+due.length+"</b> accepted commitment"+(due.length>1?"s have":" has")+" a deadline."},
      {t:"list",items:due.map(c=>({title:c.task,meta:"due "+c.deadline}))});
    else b.push({t:"text",v:"Nothing with a deadline is on your accepted list."});
    if(first)b.push({t:"text",v:"Start with <b>"+esc(first.title)+"</b> at "+first.start+"."});
    else b.push({t:"actions",items:[{label:"Plan my day",cmd:"plan my day"}]});
    return{ok:true,blocks:b};}},

/* ── insights / history / profile ────────────────────────────── */
show_insights:{cap:"insights",kind:"read",title:()=>"Insights",
  run(){const total=S.log.length,ok=S.log.filter(l=>l.kind==="ok").length,
      sug=S.log.filter(l=>l.kind==="sug").length,err=S.log.filter(l=>l.kind==="err").length;
    return{ok:true,blocks:[
      {t:"text",v:"Every one of the <b>"+total+"</b> logged events carries the reason it happened."},
      {t:"metrics",items:[{v:ok,l:"executed"},{v:sug,l:"suggested"},{v:err,l:"blocked"},
        {v:total?"100%":"—",l:"explained"}]},
      {t:"actions",items:[{label:"Open Insights",cmd:"open insights"}]}]};}},

what_learned:{cap:"insights",kind:"read",title:()=>"What I learned",
  run(){
    const items=[];
    if(S.patterns.length)items.push({title:S.patterns.length+" repeated routine(s) detected",
      meta:"from "+S.events.length+" context events"});
    if(S.commitments.length)items.push({title:S.commitments.length+" commitment(s) extracted",
      meta:"average confidence "+Math.round(S.commitments.reduce((n,c)=>n+c.confidence,0)/S.commitments.length*100)+"%"});
    if(S.automations.length){const c={};S.automations.forEach(a=>c[a.autonomy]=(c[a.autonomy]||0)+1);
      items.push({title:"You prefer “"+Object.entries(c).sort((a,b)=>b[1]-a[1])[0][0]+"” autonomy",
        meta:"across "+S.automations.length+" automation(s)"});}
    if(S.memoryPrefs.length)items.push({title:S.memoryPrefs.length+" approved preference(s) remembered",
      meta:S.memoryPrefs.map(p=>p.k).join(", ")});
    if(!items.length)return{ok:true,blocks:[
      {t:"text",v:"Not much yet — I only learn from what you approve. Give me something to work with."},
      {t:"actions",items:[{label:"Scan notifications",cmd:"scan my notifications"},
        {label:"Seed a pattern",cmd:"seed driving pattern"}]}]};
    return{ok:true,blocks:[{t:"text",v:"Here's what I've picked up — all of it from approved data on this device."},
      {t:"list",items},{t:"actions",items:[{label:"Open Memory",cmd:"open memory"}]}]};}},

show_history:{cap:"history",kind:"read",title:()=>"Recent activity",
  run(a){
    let list=S.log;
    if(a&&a.filter==="blocked")list=list.filter(l=>l.text.includes("BLOCKED"));
    if(a&&a.filter==="confirm")list=list.filter(l=>l.kind==="sug");
    if(!list.length)return{ok:true,blocks:[{t:"text",v:a&&a.filter==="blocked"
      ?"Nothing has been blocked this session."
      :"Nothing in the log yet."}]};
    return{ok:true,blocks:[
      {t:"text",v:"<b>"+list.length+"</b> entr"+(list.length>1?"ies":"y")+
        (a&&a.filter?" ("+a.filter+")":"")+", newest first."},
      {t:"list",items:list.slice(0,6).map(l=>({title:l.text,meta:l.t+(l.sim?" · SIMULATED":"")}))},
      {t:"actions",items:[{label:"Open Activity",cmd:"open history"},
        {label:"Export report",cmd:"export report"}]}]};}},

explain_why:{cap:"history",kind:"read",title:()=>"Explain",
  run(a){
    const q=(a&&a.q||"").toLowerCase();
    let hits=S.log.filter(l=>l.text.toLowerCase().includes(q)&&q.length>2);
    if(!hits.length&&q)hits=S.log.filter(l=>q.split(" ").some(w=>w.length>3&&l.text.toLowerCase().includes(w)));
    if(!hits.length)hits=S.log.slice(0,3);
    return{ok:true,blocks:[
      {t:"text",v:"Here's the reason, straight from the activity log."},
      {t:"list",items:hits.slice(0,4).map(l=>({title:l.text,meta:l.t}))},
      {t:"actions",items:[{label:"Open Activity",cmd:"open history"}]}]};}},

export_report:{cap:"history",kind:"write",title:()=>"Export report",perms:()=>[],autonomy:()=>"automatic",
  plan(){return["Collect automations, commitments and the full log","Write a plain-text file"];},
  run(){exportReport();return{ok:true,blocks:[{t:"text",v:"Exported your activity report — it downloaded to this device."}]};},
  verify(){return{on:true,rows:[{k:"Report written",ok:true}]};}},

show_profile:{cap:"profile",kind:"read",title:()=>"Profile",

    const c={};S.automations.forEach(a=>c[a.autonomy]=(c[a.autonomy]||0)+1);

      {t:"text",v:'<span class="dim">No server, no password — your profile never leaves this device.</span>'},
      {t:"actions",items:[{label:"Open Profile",cmd:"open profile"},
        {label:"What have you learned?",cmd:"what have you learned about me"}]}]};}},

change_palette:{cap:"settings",kind:"write",title:()=>"Change palette",perms:()=>[],autonomy:()=>"automatic",
  plan(){return["Cycle the accent palette"];},
  run(){cyclePalette();return{ok:true,blocks:[{t:"text",v:"Palette is now <b>"+PAL_NAME[S.palette]+"</b>."}]};},
  verify(){return{on:true,rows:[{k:"Palette "+S.palette,ok:true}]};}},

fire_event:{cap:"demo",kind:"write",title:a=>"Fire test event",perms:()=>[],autonomy:()=>"automatic",
  plan(a){return["Fire a SIMULATED "+a.type.replace(/_/g," ")+" event","Let matching automations and modes react"];},
  run(a){fireContext(a.type,a.value);
    return{ok:true,blocks:[{t:"text",v:"Fired a simulated <b>"+esc(a.type.replace(/_/g," "))+
      (a.value?" ("+esc(a.value)+")":"")+"</b> event. Anything that matched has been logged."}]};},
  verify(){return{on:true,rows:[{k:"Event recorded",ok:true}]};}},

seed_pattern:{cap:"demo",kind:"write",title:()=>"Seed driving pattern",perms:()=>[],autonomy:()=>"automatic",
  plan(){return["Replay four simulated driving sessions","Run pattern detection","Offer a suggestion"];},
  run(){seedDriving();const p=S.patterns.filter(x=>x.status==="suggested");
    return{ok:true,blocks:[
      {t:"text",v:p.length?"I found a repeated routine: <b>"+esc(p[0].summary)+"</b>"
        :"Seeded the events, but nothing repeated often enough to suggest yet."},
      ...(p.length?[{t:"actions",items:[{label:"Accept it",cmd:"accept the pattern"}]}]:[])]};},
  verify(){return{on:true,rows:[{k:"Events seeded",ok:true},
    {k:"Pattern analysis run",ok:S.patterns.length>0}]};}},

accept_pattern:{cap:"automations",kind:"write",title:()=>"Turn pattern into automation",
  perms:()=>[],autonomy:()=>"confirm",
  plan(){const p=S.patterns.find(x=>x.status==="suggested");
    return[p?"Create an automation from “"+p.summary.slice(0,50)+"…”":"No suggestion available",
      "Save it with Confirm autonomy"];},
  run(){const p=S.patterns.find(x=>x.status==="suggested");
    if(!p)return{ok:true,noop:true,blocks:[{t:"text",v:"There's no pattern suggestion waiting."}]};
    acceptPattern(p.id);return{ok:true,blocks:[]};},
  verify(){return{on:S.automations.some(a=>a.name.includes("Driving")),
    rows:[{k:"Automation created from pattern",ok:S.automations.some(a=>a.name.includes("Driving"))}]};}},

dismiss_pattern:{cap:"automations",kind:"write",title:()=>"Dismiss suggestion",
  perms:()=>[],autonomy:()=>"automatic",
  plan(){return["Dismiss the pattern suggestion","I won't raise it again"];},
  run(){const p=S.patterns.find(x=>x.status==="suggested");
    if(!p)return{ok:true,noop:true,blocks:[{t:"text",v:"There's no suggestion open."}]};
    dismissPattern(p.id);return{ok:true,blocks:[{t:"text",v:"Dismissed — I won't raise that one again."}]};},
  verify(){return{on:!S.patterns.some(x=>x.status==="suggested"),
    rows:[{k:"Suggestion cleared",ok:!S.patterns.some(x=>x.status==="suggested")}]};}},

sign_out:{cap:"profile",kind:"destructive",title:()=>"Sign out",perms:()=>[],autonomy:()=>"confirm",
  plan(){return["Sign out of this device","Your automations and history stay"];},
  run(){signOut();return{ok:!S.user,blocks:[]};},
  verify(){return{on:!S.user,rows:[{k:"Signed out",ok:!S.user},{k:"Automations kept",ok:true}]};}},
};

/* ══════════════ 4 · NATURAL-LANGUAGE UNDERSTANDING ══════════════
   Rule-based intent + entity extraction over the real app vocabulary.
   Returns {action, args, clarify}. Order matters: questions before
   commands, so "why did you activate X" never activates anything. */

const MODE_WORDS={college:"college",campus:"college",work:"work",office:"work",
  driving:"driving",drive:"driving",car:"driving",gym:"gym",workout:"gym",
  sleep:"sleep",night:"sleep",bedtime:"sleep"};
const PERM_WORDS={notification:"notifications",notifications:"notifications",location:"location",
  gps:"location",calendar:"calendar",bluetooth:"connectivity",connectivity:"connectivity",
  dnd:"dnd","do not disturb":"dnd",messaging:"messaging",message:"messaging",
  settings:"settings",camera:"camera"};
const FEATURE_WORDS={echolens:"echolens",lens:"echolens",planner:"planner",plan:"planner",
  insights:"insights",autonomy:"autonomy",permission:"permissions",permissions:"permissions",
  control:"control",history:"history",activity:"history",memory:"memory",profile:"profile",
  automation:"automations",automations:"automations",mode:"modes",modes:"modes",
  "command palette":"commands",palette:"themes",theme:"themes",milestone:"achievements",
  achievement:"achievements",home:"home",create:"teach","teach echo":"teach"};

const norm=t=>(" "+String(t||"").toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9'\s:]/g," ")
  .replace(/\s+/g," ")+" ");
function findMode(t){for(const k in MODE_WORDS)if(t.includes(" "+k))return MODE_WORDS[k];return null;}
function findPerm(t){if(t.includes("do not disturb"))return "dnd";
  for(const k in PERM_WORDS)if(t.includes(" "+k))return PERM_WORDS[k];return null;}
function findFeature(t){if(t.includes("command palette"))return "commands";
  for(const k of Object.keys(FEATURE_WORDS).sort((a,b)=>b.length-a.length))
    if(t.includes(" "+k))return FEATURE_WORDS[k];return null;}
function findLevel(t){if(t.includes("automatic"))return "automatic";
  if(t.includes("confirm"))return "confirm";if(t.includes("suggest"))return "suggest";return null;}
/** what the user is currently looking at — used to resolve "this" (§18) */
function screenContext(){
  if(S.tab==="modes"){
    const on=activeModes();
    if(on.length===1)return{kind:"mode",id:on[0].id,name:on[0].name,src:"screen"};
    return{kind:"mode-screen"};
  }
  if(S.tab==="lens"){
    const c=S.commitments.filter(x=>x.status==="candidate");
    if(c.length===1)return{kind:"commitment",id:c[0].id,name:c[0].task,src:"screen"};
  }
  if(S.tab==="home"&&S.automations.length===1)
    return{kind:"automation",id:S.automations[0].id,name:S.automations[0].name,src:"screen"};
  if(S.tab==="plan"&&S.plan)return{kind:"plan",src:"screen"};
  return null;
}
/** ordinal / "this" resolution against short-term conversation memory */
function pickFromContext(t,kind){
  const list=(ECHO.ctx.list||[]).filter(x=>!kind||x.kind===kind);
  const ord={first:0,"1st":0,one:0,second:1,"2nd":1,third:2,"3rd":2,last:-1};
  for(const w in ord)if(t.includes(" "+w))return list.length?(ord[w]===-1?list[list.length-1]:list[ord[w]]):null;
  if(/\b(this|that|it|the one)\b/.test(t)){
    if(ECHO.ctx.entity&&(!kind||ECHO.ctx.entity.kind===kind))return ECHO.ctx.entity;
    if(list.length===1)return list[0];
    const sc=screenContext();                       // §18 — what's on screen right now
    if(sc&&(!kind||sc.kind===kind))return sc;
    if(list.length>1)return"AMBIGUOUS";
  }
  return null;
}

function echoUnderstand(raw){
  const t=norm(raw);
  const has=(...w)=>w.some(x=>t.includes(x));
  /* §9 — a secondary "explain" rider is stripped and remembered, not lost */
  const wantsExplain=/(and )?(tell me|explain|show me) (what|which|how) (it|that|this|they)? ?(will|would)? ?(change|do|affect)/.test(t)
    ||has(" and tell me what it will change"," and explain what it does"," and what will it change");
  const R=r=>{ if(wantsExplain&&r&&r.action)r.args=Object.assign({},r.args,{explainAfter:true}); return r; };
  const _ret=echoUnderstand_inner(t,raw,has);
  return R(_ret);
}
function echoUnderstand_inner(t,raw,has){

  /* ---------- 1. questions & explanations (never mutate) ---------- */
  if(has(" what can you do"," what are you able"," what can echo do"," your capabilities"," help me"))
    return{action:"capabilities",args:{}};
  if(has(" what is echoos"," what's echoos"," about echoos"," tell me about echoos"," what are you"))
    return{action:"about_product",args:{}};
  if(has(" are you working"," system status"," what is running"," what's running"," what is currently active",
        " what's currently active"," what is happening"," what's happening"," status"))
    return{action:"system_status",args:{}};
  if(has(" what's important"," what is important"," anything important"," what matters"," brief me",
        " what do i need to know"))
    return{action:"whats_important",args:{}};

  if(has(" why ")||t.startsWith(" why")){
    if(has("confirm"))return{action:"show_history",args:{filter:"confirm"}};
    if(has("block")||has("can't")||has("cannot")||has("couldn't")){
      const p=findPerm(t),m=findMode(t);
      if(p||m)return{action:"explain_block",args:{perm:p,mode:m,q:raw}};
      return{action:"show_history",args:{filter:"blocked"}};
    }
    return{action:"explain_why",args:{q:raw}};
  }
  if(has(" what is "," what's "," explain "," how does "," how do "," tell me about ")){
    const m=findMode(t);
    if(m&&has("mode"))return{action:"explain_mode",args:{id:m}};
    const f=findFeature(t);
    if(f)return{action:"explain_feature",args:{key:f}};
  }
  if(has(" what happens when i enable automatic"," what does automatic"))
    return{action:"explain_feature",args:{key:"autonomy"}};

  /* ---------- 2. multi-step routines ---------- */
  if(has(" morning routine"," run my morning"," start my morning"))
    return{action:"routine_morning",args:{}};
  if(has("plan")&&has("priorit"))return{action:"routine_plan_priority",args:{}};
  if(has("scan")&&(has("automation")||has("repeated")||has("pattern")))
    return{action:"routine_scan_patterns",args:{}};

  /* ---------- 3. navigation ---------- */
  if(has(" open "," go to "," take me to "," show me the ")||t.match(/^\s(open|show)\s/)){
    const map=[["control","control","Control","ctrl"],["permission","control","Control","ctrl"],
      ["history","history","Activity","hist"],["activity","history","Activity","hist"],
      ["memory","memory","Memory","mem"],["insight","insights","Insights","insights"],
      ["profile","profile","Profile","profile"],["planner","plan","Planner",null],
      ["lens","lens","EchoLens",null],["mode","modes","Modes",null],
      ["teach","create","Teach Echo",null],["create","create","Teach Echo",null],
      ["home","home","Home",null]];
    for(const[w,tab,label,seg]of map)if(t.includes(" "+w))
      return{action:"navigate",args:{target:tab,label,seg}};
  }

  /* ---------- 4. modes ---------- */
  /* §18/§19 — "turn this on", "turn off the first one": resolve from the
     conversation, then from the screen you're actually looking at. */
  const deictic=/\b(this|that|it|first|second|third|last|the one)\b/.test(t);
  const vOn =/\bturn\b[^.]*\bon\b/.test(t)||has(" activate"," switch on"," enable it"," start it");
  const vOff=/\bturn\b[^.]*\boff\b/.test(t)||has(" deactivate"," switch off"," disable it"," stop it");
  if(deictic&&(vOn||vOff)&&!findMode(t)&&!findPerm(t)){
    const off=vOff&&!vOn;
    let pick=pickFromContext(t,"mode");
    if(!pick||pick==="AMBIGUOUS"){
      const anyPick=pickFromContext(t);
      if(anyPick&&anyPick!=="AMBIGUOUS")pick=anyPick;
      else if(pick!=="AMBIGUOUS")pick=null;
    }
    if(pick&&pick!=="AMBIGUOUS"){
      if(pick.kind==="mode")return{action:off?"deactivate_mode":"activate_mode",args:{id:pick.id}};
      if(pick.kind==="automation")return{action:off?"disable_automation":"enable_automation",args:{id:pick.id}};
    }
    const sc=screenContext();
    if(sc&&sc.kind==="mode")return{action:off?"deactivate_mode":"activate_mode",args:{id:sc.id}};
    if(S.tab==="modes"||(sc&&sc.kind==="mode-screen"))
      return{clarify:"Which mode do you mean?",
        options:MODES.map(m=>({label:m.name,cmd:(off?"deactivate ":"activate ")+m.name+" mode"}))};
    if(S.automations.length>1)
      return{clarify:"Which automation do you mean?",
        options:S.automations.map(a=>({label:a.name,cmd:(off?"disable":"enable")+" automation "+a.name}))};
    return{clarify:"I'm not sure what “this” refers to — name it and I'll do it.",
      options:MODES.slice(0,3).map(m=>({label:m.name+" Mode",cmd:(off?"deactivate ":"activate ")+m.name+" mode"}))};
  }
  if(has(" what modes"," which modes"," list modes"," my modes"," modes do i"," modes are available"))
    return{action:"list_modes",args:{}};
  if(has(" which mode is active"," what mode is active"," active mode"," modes are active"," am i in "))
    return{action:"active_modes",args:{}};
  const level=findLevel(t);
  if(level&&has("mode")&&has(" make "," set "," change ")){
    const m=findMode(t);if(m)return{action:"change_mode_autonomy",args:{id:m,level}};
  }
  if(has(" turn off"," deactivate"," switch off"," disable"," stop"," end ")&&has("mode")){
    const m=findMode(t)||(pickFromContext(t,"mode")||{}).id;
    if(m==="AMBIGUOUS"||(!m&&ECHO.ctx.kind==="mode"))return{clarify:"Which mode should I turn off?",
      options:activeModes().map(x=>({label:x.name,cmd:"deactivate "+x.name+" mode"}))};
    if(m)return{action:"deactivate_mode",args:{id:m}};
  }
  const creatingAuto=has(" create an automation"," create automation"," make an automation",
    " add an automation"," set up an automation"," automate ")||/^\s(when|whenever|every day|everyday|each time)\b/.test(t);
  if(!creatingAuto&&has(" turn on"," activate"," switch on"," enable"," put me in"," put me into"," start ")&&
     (has("mode")||has("routine"))){
    const m=findMode(t);
    if(m)return{action:"activate_mode",args:{id:m}};
  }
  { const m=findMode(t);
    if(m&&has("mode")&&!has("what")&&!creatingAuto&&!has("create")&&!has("automation")){
      if(has(" turn on"," activate"," enable"," switch on"))return{action:"activate_mode",args:{id:m}};
      return{action:"explain_mode",args:{id:m}};
    } }

  /* ---------- 5. automations ---------- */
  if(has(" pending approval"," waiting for approval"," needs approval"," pending automation"))
    return{action:"list_automations",args:{filter:"pending"}};
  if(has("automation")&&has(" active "," are active"," currently active"))
    return{action:"list_automations",args:{filter:"active"}};
  if(has("automation")&&has(" automatic")&&has(" which "," can run"," what "))
    return{action:"list_automations",args:{filter:"automatic"}};
  if(has(" what automations"," which automations"," my automations"," list automations"," show automations",
        " automations do i"))
    return{action:"list_automations",args:{}};
  if(has(" approve")&&!has("why"))return{action:"approve_pending",args:{}};
  if(has("automation")&&has(" delete "," remove ")){
    const pick=pickFromContext(t,"automation");
    if(pick==="AMBIGUOUS")return{clarify:"Which automation should I delete?",
      options:S.automations.map(a=>({label:a.name,cmd:"delete automation "+a.name}))};
    const byName=S.automations.find(a=>t.includes(" "+a.name.toLowerCase().split(" ")[0]));
    const target=pick||byName||(S.automations.length===1?{id:S.automations[0].id}:null);
    if(!target)return{clarify:"Which automation should I delete?",
      options:S.automations.map(a=>({label:a.name,cmd:"delete automation "+a.name}))};
    return{action:"delete_automation",args:{id:target.id}};
  }
  if(has("automation")&&level&&has(" change "," make "," set "," switch ")){
    const pick=pickFromContext(t,"automation");
    const byName=S.automations.find(a=>t.includes(" "+a.name.toLowerCase().split(" ")[0]));
    const target=(pick&&pick!=="AMBIGUOUS"&&pick)||byName||
      (S.automations.length===1?{id:S.automations[0].id}:null);
    if(!target)return{clarify:"Which automation should I change?",
      options:S.automations.map(a=>({label:a.name,cmd:"change "+a.name+" automation to "+level}))};
    return{action:"change_automation_autonomy",args:{id:target.id,level}};
  }
  if(has("automation")&&has(" disable "," turn off ")){
    const byName=S.automations.find(a=>t.includes(" "+a.name.toLowerCase().split(" ")[0]));
    const target=byName||(S.automations.length===1?S.automations[0]:null);
    if(!target)return{clarify:"Which automation should I disable?",
      options:S.automations.map(a=>({label:a.name,cmd:"disable automation "+a.name}))};
    return{action:"disable_automation",args:{id:target.id}};
  }
  if(has("automation")&&has(" enable "," turn on ")){
    const byName=S.automations.find(a=>t.includes(" "+a.name.toLowerCase().split(" ")[0]));
    const target=byName||(S.automations.length===1?S.automations[0]:null);
    if(target)return{action:"enable_automation",args:{id:target.id}};
  }
  if(has(" accept the pattern"," accept pattern"," automate it"," turn it into an automation"))
    return{action:"accept_pattern",args:{}};
  if(has(" dismiss the pattern"," dismiss pattern"," not now"))
    return{action:"dismiss_pattern",args:{}};

  /* creation: explicit, or a natural "when … , …" sentence */
  const wantsCreate=has(" create an automation"," create automation"," make an automation"," add an automation",
    " automate "," set up an automation"," create a reminder"," remind me ");
  if(wantsCreate||/^\s(when|whenever|every day|everyday|each time)\b/.test(t)){
    const v=validateIntent(parseNL(raw));   // sync intent; backend parity via smartParse in Teach Echo
    if(v.valid)return{action:"create_automation",
      args:{intent:v.intent,name:v.intent.summary.slice(0,42),level:level||"confirm",rejected:v.rejected}};
    return{action:"create_failed",args:{reason:v.reason||"I couldn't find a supported action in that.",raw}};
  }

  /* ---------- 6. EchoLens ---------- */
  if(has(" scan")&&has("image","photo","poster","picture"))return{action:"scan_image",args:{}};
  if(has(" scan")&&(has("notification")||has("what matters")||t.trim()===" scan "))
    return{action:"scan_notifications",args:{}};
  if(has(" echolens find"," lens find"," what did echolens"," scan results"))
    return{action:"list_commitments",args:{}};
  if(has(" accept")&&has("commitment")){
    const pick=pickFromContext(t,"commitment");
    if(pick==="AMBIGUOUS")return{clarify:"Which commitment should I accept?",
      options:S.commitments.filter(c=>c.status==="candidate").map(c=>({label:c.task,cmd:"accept commitment "+c.task}))};
    const byName=S.commitments.find(c=>c.status==="candidate"&&
      t.includes(" "+c.task.toLowerCase().split(" ")[0]));
    const cands=S.commitments.filter(c=>c.status==="candidate");
    const target=pick||byName||(cands.length===1?cands[0]:null);
    if(!target)return{clarify:"Which commitment should I accept?",
      options:cands.map(c=>({label:c.task,cmd:"accept commitment "+c.task}))};
    return{action:"accept_commitment",args:{id:target.id}};
  }
  if(has(" dismiss")||(has(" reject")&&has("commitment"))){
    const pick=pickFromContext(t,"commitment");
    if(pick==="AMBIGUOUS")return{clarify:"Which commitment should I dismiss?",
      options:S.commitments.filter(c=>c.status==="candidate").map(c=>({label:c.task,cmd:"dismiss commitment "+c.task}))};
    const cands=S.commitments.filter(c=>c.status==="candidate");
    const byName=cands.find(c=>t.includes(" "+c.task.toLowerCase().split(" ")[0]));
    const target=pick||byName||(cands.length===1?cands[0]:null);
    if(!target)return{clarify:"Which commitment should I dismiss?",
      options:cands.map(c=>({label:c.task,cmd:"dismiss commitment "+c.task}))};
    return{action:"dismiss_commitment",args:{id:target.id}};
  }
  if(has(" commitment"," what do i need to finish"," anything pending"," what did i promise"))
    return{action:"list_commitments",args:{}};

  /* ---------- 7. planner ---------- */
  if(has(" plan my day"," plan my afternoon"," plan tomorrow"," build a plan"," make a plan"," plan the day"))
    return{action:"generate_plan",args:{}};
  if(has(" highest priority"," work on first"," most important task"," priorit"," due today"))
    return{action:"priority_tasks",args:{}};
  if(has(" my planner"," my plan"," my day looking"," my schedule"," what's on my"," whats on my"," my day"))
    return{action:"show_plan",args:{}};

  /* ---------- 8. insights / history ---------- */
  if(has(" know about me"," about me")&&!has("learn"))
    return{action:"show_profile",args:{}};
  if(has(" learned about me"," what have you learned"," what did you learn"," learned about"))
    return{action:"what_learned",args:{}};
  if(has(" insight")||has(" how explainable")||has(" how many actions"))
    return{action:"show_insights",args:{}};
  if(has(" blocked action"," show blocked"," what was blocked"))
    return{action:"show_history",args:{filter:"blocked"}};
  if(has(" what did you do"," what happened"," recent activity"," my activity"," actions did you perform",
        " show me my history"," activity log"))
    return{action:"show_history",args:{}};
  if(has(" export"))return{action:"export_report",args:{}};

  /* ---------- 9. profile / permissions / appearance ---------- */
  if(has(" about me"," my profile"," who am i"," my account"," my default autonomy"," what theme"," what palette"))
    return{action:"show_profile",args:{}};
  if(has(" sign out"," log out"," sign me out"))return{action:"sign_out",args:{}};
  if(has(" what permissions"," what can you access"," which permissions"," permission do you"," your access",
        " data sources"))
    return{action:"list_permissions",args:{}};
  { const p=findPerm(t);
    if(p&&has(" disable "," turn off "," switch off "," revoke "))
      return{action:"change_permission",args:{key:p,on:false}};
    if(p&&has(" enable "," turn on "," switch on "," allow "," grant "))
      return{action:"change_permission",args:{key:p,on:true}};
    if(p&&has(" is "," enabled"," do you have"))return{action:"list_permissions",args:{}};
  }
  if(has(" change the theme"," change theme"," dark mode"," light mode"," switch theme"))
    return{action:"change_theme",args:{}};
  if(has(" change the palette"," change palette"," different colour"," different color"," switch palette"))
    return{action:"change_palette",args:{}};

  /* ---------- 10. demo / simulation ---------- */
  if(has(" seed")&&has("pattern","driving"))return{action:"seed_pattern",args:{}};
  if(has(" fire ")||has(" simulate ")||has(" test event")){
    const m=findMode(t);
    if(has("car")||has("bluetooth"))return{action:"fire_event",args:{type:"bluetooth_connect",value:"Car Stereo"}};
    if(m)return{action:"fire_event",args:{type:"location_enter",value:m}};
  }
  if(has(" i reach ")||has(" i arrive ")){
    const m=findMode(t);if(m)return{action:"fire_event",args:{type:"location_enter",value:m}};
  }
  return{action:null,args:{},raw};
}

/* ══════════════ 5 · EXTRA READ ACTIONS + ROUTINES ══════════════ */
Object.assign(AGENT_ACTIONS,{

whats_important:{cap:"system",kind:"read",title:()=>"What's important",
  run(){
    const pend=pendingAutos(),
      due=S.commitments.filter(c=>c.status==="accepted"&&c.deadline),
      cand=S.commitments.filter(c=>c.status==="candidate"),
      sug=S.patterns.filter(p=>p.status==="suggested"),
      first=S.plan?S.plan.blocks.find(b=>b.kind==="commitment"||b.kind==="task"):null;
    const items=[];
    if(pend.length)items.push({title:pend.length+" automation(s) waiting for your approval",meta:"Needs you"});
    due.forEach(c=>items.push({title:c.task,meta:"Due "+c.deadline}));
    if(cand.length)items.push({title:cand.length+" commitment candidate(s) to review",meta:"EchoLens"});
    if(sug.length)items.push({title:sug.length+" routine I could automate",meta:"Pattern"});
    if(first)items.push({title:"Start with "+first.title+" at "+first.start,meta:"Plan"});
    if(!items.length)return{ok:true,blocks:[
      {t:"text",v:"Nothing is pressing. Nothing waiting for approval, no deadlines on your accepted list."},
      {t:"actions",items:[{label:"Scan notifications",cmd:"scan my notifications"},
        {label:"Plan my day",cmd:"plan my day"}]}]};
    ECHO.ctx.list=cand.map(c=>({kind:"commitment",id:c.id,name:c.task}));
    if(cand.length)ECHO.ctx.kind="commitment";
    return{ok:true,blocks:[

      {t:"actions",items:[...(pend.length?[{label:"Review approvals",cmd:"show pending approvals"}]:[]),
        ...(S.plan?[]:[{label:"Plan my day",cmd:"plan my day"}])]}]};}},

/* multi-step routines — each step is a real action through the real pipeline */
const ECHO_ROUTINES={
  routine_morning:{title:"Morning routine",
    steps:["Check what needs your attention","Scan permitted notifications","Build today's plan","Summarise priorities"],
    seq:[{a:"scan_notifications"},{a:"generate_plan"},{a:"whats_important"}]},
  routine_plan_priority:{title:"Plan + prioritise",
    steps:["Read commitments and deadlines","Build the plan","Rank what's due"],
    seq:[{a:"generate_plan"},{a:"priority_tasks"}]},
  routine_scan_patterns:{title:"Scan + find routines",
    steps:["Scan permitted notifications","Analyse repeated behaviour","Offer an automation"],
    seq:[{a:"scan_notifications"},{a:"seed_pattern"}]},

/* ══════════════ 6 · THE PIPELINE ══════════════
   understand → plan → permissions → autonomy → ask → execute → verify
   → explain → log.  Every write goes through here; nothing skips it. */

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const FAST=()=>!!window.ECHO_FAST;

function echoSay(blocks,opts){ECHO.messages.push({who:"echo",blocks,...(opts||{})});renderAgent();}
function echoUser(text){ECHO.messages.push({who:"user",text});renderAgent();}
function echoState(s){ECHO.state=s;const o=$("orb");if(o)o.dataset.state=s;renderAgent();}

async function echoAsk(text){
  const raw=String(text||"").trim(); if(!raw||ECHO.busy)return null;
  ECHO.busy=true; echoUser(raw);
  const u=echoUnderstand(raw);
  echoState("thinking"); ECHO.messages.push({who:"echo",typing:true}); renderAgent();
  await sleep(FAST()?0:260);
  ECHO.messages=ECHO.messages.filter(m=>!m.typing);

  try{
    if(u.clarify){                                   // ambiguity → ask, never guess
      echoState("waiting");
      echoSay([{t:"text",v:esc(u.clarify)},
        {t:"actions",items:(u.options||[]).slice(0,5)}]);
      return finish("clarify");
    }
    if(!u.action){                                   // unknown → explain, never hallucinate
      echoState("idle");
      echoSay([{t:"text",v:"I couldn't map that to something I can actually do."},
        {t:"text",v:'<span class="dim">I operate EchoOS itself — modes, automations, EchoLens, '+
          'the planner, permissions and your activity log.</span>'},
        {t:"actions",items:[{label:"What can you do?",cmd:"what can you do"},
          {label:"What's important today?",cmd:"what's important today"}]}]);
      return finish("unknown");
    }
    if(ECHO_ROUTINES[u.action])return await runRoutine(u.action);

    const act=AGENT_ACTIONS[u.action];
    if(!act){echoState("idle");echoSay([{t:"text",v:"That capability isn't implemented."}]);return finish("missing");}

    /* READ — safe, answer immediately */
    if(act.kind==="read"){
      const r=act.run(u.args)||{blocks:[]};
      echoState("idle"); echoSay(r.blocks);
      return finish("read",r);
    }

    /* WRITE / DESTRUCTIVE — full gate */
    const perms=act.perms?act.perms(u.args):[];
    const missing=perms.filter(p=>!S.caps[p]);
    if(missing.length){
      echoState("blocked");
      const label=missing.map(p=>PERM_LABEL[p]).join(" and ");
      echoSay([{t:"blocked",what:act.title(u.args),why:label+" "+(missing.length>1?"are":"is")+" switched off.",
          need:label,can:"Turn it on in Control and ask me again. Nothing was performed."},
        {t:"actions",items:[{label:"Open Control",cmd:"open control"},
          {label:"Enable "+PERM_LABEL[missing[0]],cmd:"enable "+missing[0]}]}]);
      log("err","Echo blocked “"+act.title(u.args)+"” — required data source off: "+missing.join(", ")+
        ". No action performed.");
      return finish("blocked");
    }
    const autonomy=act.autonomy?act.autonomy(u.args):"confirm";
    const steps=act.plan?act.plan(u.args):[act.title(u.args)];

    if(autonomy==="suggest"){                       // Suggest → propose only
      echoState("waiting");
      ECHO.pending={action:u.action,args:u.args,title:act.title(u.args),steps,perms,autonomy};
      echoSay([{t:"text",v:"Autonomy for this is <b>Suggest</b>, so I won't run it on my own."},
        {t:"confirm",title:"Echo would",steps,perms,autonomy,label:"Run it anyway"}]);
      log("sug","Echo suggested “"+act.title(u.args)+"” (autonomy: suggest) — awaiting your decision.");
      return finish("suggested");
    }
    if(autonomy==="confirm"||act.kind==="destructive"){
      echoState("waiting");
      ECHO.pending={action:u.action,args:u.args,title:act.title(u.args),steps,perms,autonomy,
        destructive:act.kind==="destructive"};
      echoSay([{t:"text",v:act.kind==="destructive"
        ?"This one is permanent, so I need an explicit yes."
        :"Autonomy is <b>Confirm</b> — here's exactly what I'd do."},
        {t:"confirm",title:act.kind==="destructive"?"This will permanently":"Echo will",steps,perms,autonomy,
          label:act.kind==="destructive"?"Delete":"Continue",danger:act.kind==="destructive"}]);
      log("sug","Echo prepared “"+act.title(u.args)+"” and asked for confirmation"+
        (act.kind==="destructive"?" (destructive action)":"")+".");
      return finish("awaiting-confirm");
    }
    return await echoExecute(u.action,u.args,steps,"Pre-approved (Automatic).");
  }finally{ ECHO.busy=false; }

  function finish(kind,r){ECHO.busy=false;return{kind,result:r};}
}

async function echoExecute(key,args,steps,why){
  const act=AGENT_ACTIONS[key];
  echoState("executing");
  const idx=ECHO.messages.push({who:"echo",exec:{steps,at:0,done:false}})-1;
  renderAgent();
  for(let i=0;i<steps.length;i++){
    ECHO.messages[idx].exec.at=i; renderAgent(); await sleep(FAST()?0:150);
  }
  let r;
  try{
    if(act.runAsync)await act.runAsync(args);          // backend round-trip, if any
    r=act.run(args)||{ok:false,blocks:[]};
  }
  catch(e){ r={ok:false,error:String(e&&e.message||e),blocks:[]}; }
  ECHO.messages[idx].exec.at=steps.length;
  ECHO.messages[idx].exec.done=true;
  ECHO.messages[idx].exec.ok=r.ok!==false;
  renderAgent();

  const v=(!r.noop&&act.verify)?act.verify(args):null;
  const blocks=[...(r.blocks||[])];
  if(r.noop){ echoState("idle"); echoSay(blocks); ECHO.busy=false; return{kind:"noop",result:r}; }

  if(r.ok===false){
    echoState("blocked");
    blocks.push({t:"blocked",what:act.title(args),
      why:r.error?("Execution error: "+esc(r.error)):"The action did not complete.",
      need:"—",can:"Nothing was reported as successful. Check Activity for the full trace."});
    blocks.push({t:"actions",items:[{label:"Show activity",cmd:"show my recent activity"}]});
    log("err","Echo could not complete “"+act.title(args)+"”. Reported as a failure, not a success.");
    echoSay(blocks); ECHO.busy=false; return{kind:"failed",result:r};
  }
  if(v){
    const failed=v.rows.filter(x=>!x.ok);
    blocks.push({t:"verify",ok:v.on&&!failed.length,rows:v.rows});
    if(failed.length){
      blocks.push({t:"text",v:"<b>Partial result.</b> "+failed.length+" step(s) did not take effect — "+
        "I'm not going to call that done."});
      blocks.push({t:"actions",items:[{label:"Open Control",cmd:"open control"}]});
    }
  }
  if(!blocks.some(b=>b.t==="text"))
    blocks.unshift({t:"text",v:"<b>"+esc(act.title(args))+"</b> — done."});
  if(args&&args.explainAfter&&act.explainAfter){                 // §9 secondary request
    (act.explainAfter(args)||[]).forEach(b=>blocks.push(b));
  }
  echoState(v&&v.on===false?"blocked":"idle");
  log("ok","Echo executed “"+act.title(args)+"”. "+(why||"")+" Verified against live state.");
  echoSay(blocks); ECHO.busy=false;
  render();
  return{kind:"executed",result:r};
}

async function runRoutine(key){
  const R=ECHO_ROUTINES[key];
  echoState("executing");
  const idx=ECHO.messages.push({who:"echo",exec:{steps:R.steps,at:0,done:false}})-1;renderAgent();
  const out=[];
  for(let i=0;i<R.seq.length;i++){
    ECHO.messages[idx].exec.at=i;renderAgent();await sleep(FAST()?0:180);
    const step=R.seq[i],act=AGENT_ACTIONS[step.a];
    const perms=act.perms?act.perms(step.args||{}):[];
    const missing=perms.filter(p=>!S.caps[p]);
    if(missing.length){
      out.push({t:"blocked",what:act.title(step.args||{}),
        why:missing.map(p=>PERM_LABEL[p]).join(" and ")+" off — I skipped this step.",
        need:missing.map(p=>PERM_LABEL[p]).join(", "),can:"Enable it in Control and run the routine again."});
      log("err","Echo skipped “"+act.title(step.args||{})+"” during "+R.title+" — "+missing.join(", ")+" off.");
      continue;
    }
    try{ const r=act.run(step.args||{}); (r.blocks||[]).forEach(b=>out.push(b)); }
    catch(e){ out.push({t:"text",v:"A step failed: "+esc(String(e.message||e))}); }
  }
  ECHO.messages[idx].exec.at=R.steps.length;
  ECHO.messages[idx].exec.done=true;ECHO.messages[idx].exec.ok=true;
  echoState("idle");
  log("ok","Echo ran the "+R.title+" routine — each step logged separately.");
  echoSay([{t:"text",v:"<b>"+R.title+"</b> complete."},...out]);
  ECHO.busy=false; render();
  return{kind:"routine"};
}

function echoConfirm(){
  const p=ECHO.pending; if(!p)return; ECHO.pending=null;
  ECHO.messages=ECHO.messages.map(m=>({...m,blocks:(m.blocks||[]).map(b=>
    b.t==="confirm"?{...b,resolved:"approved"}:b)}));
  log("info","You approved “"+p.title+"”.");
  echoExecute(p.action,p.args,p.steps,"You confirmed it.");
}
function echoCancel(){
  const p=ECHO.pending; if(!p)return; ECHO.pending=null;
  ECHO.messages=ECHO.messages.map(m=>({...m,blocks:(m.blocks||[]).map(b=>
    b.t==="confirm"?{...b,resolved:"cancelled"}:b)}));
  echoState("idle");
  log("info","You cancelled “"+p.title+"”. Nothing was performed.");
  echoSay([{t:"text",v:"Cancelled — nothing was performed."}]);
}

/* ══════════════ 7 · AGENT INTERFACE ══════════════ */
const ECHO_SUGGEST=[
  "What's important today?","Run my morning routine","Activate College Mode",
  "Scan my notifications","Plan my day","What can you do?"];

/** §36 — Echo may OFFER, never auto-create. Fires at most once per finding. */
function echoProactive(){
  ECHO.offered=ECHO.offered||new Set();
  const out=[];
  const pat=S.patterns.find(p=>p.status==="suggested");
  if(pat&&!ECHO.offered.has("pat"+pat.id)){ECHO.offered.add("pat"+pat.id);
    out.push({t:"text",v:"One thing I noticed on my own:"},
      {t:"cards",items:[{title:"A routine repeated "+pat.freq+" times",meta:pat.summary,
        tag:"suggestion",tagClass:"pri",conf:pat.conf,
        actions:[{label:"Create automation",cmd:"accept the pattern",style:""},
                 {label:"Not now",cmd:"dismiss the pattern"}]}]});}
  const stale=S.commitments.filter(c=>c.status==="candidate");
  if(!out.length&&stale.length>=3&&!ECHO.offered.has("stale")){ECHO.offered.add("stale");
    out.push({t:"text",v:"You have <b>"+stale.length+"</b> commitment candidates I haven't been told to keep."},
      {t:"actions",items:[{label:"Review them",cmd:"what commitments do I have"}]});}
  const pend=pendingAutos();
  if(!out.length&&pend.length&&!ECHO.offered.has("pend"+pend.length)){ECHO.offered.add("pend"+pend.length);
    out.push({t:"text",v:"<b>"+pend.length+"</b> automation"+(pend.length>1?"s are":" is")+
      " waiting on you — I won't run "+(pend.length>1?"them":"it")+" until you say so."},
      {t:"actions",items:[{label:"Review approvals",cmd:"show pending approvals"}]});}
  if(out.length)ECHO.messages.push({who:"echo",blocks:out});
}
function openEcho(seed){
  ECHO.open=true;$("agentwrap").classList.add("open");
  if(!ECHO.messages.length)
    ECHO.messages.push({who:"echo",blocks:[
      {t:"text",v:"I'm <b>Echo</b>. I don't just talk about EchoOS — I operate it: modes, "+
        "automations, EchoLens, the planner, permissions and your activity log."},
      {t:"text",v:'<span class="dim">Ask a question, or tell me to do something. Anything that '+
        'changes state goes through permissions, autonomy and your confirmation first.</span>'}]});
  echoProactive();
  renderAgent();
  setTimeout(()=>{const i=$("aq");if(i&&!seed)i.focus();},80);
  if(seed)echoAsk(seed);
}
function closeEcho(){ECHO.open=false;$("agentwrap").classList.remove("open");}
function echoSubmit(){const i=$("aq");if(!i)return;const v=i.value.trim();if(!v)return;
  i.value="";i.style.height="auto";echoAsk(v);}
function echoKey(e){
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();echoSubmit();}
  if(e.key==="Escape")closeEcho();
}
function echoChip(cmd){const i=$("aq");if(i)i.value="";echoAsk(cmd);}

function blockHTML(b){

      <div class="acard">
        <div class="acard-h"><span class="acard-t">${esc(c.title)}</span>
          ${c.tag?`<span class="chip ${c.tagClass||""}">${esc(c.tag)}</span>`:""}</div>
        ${c.meta?`<div class="acard-m">${esc(c.meta)}</div>`:""}

      </div>`).join("")}</div>`;
    case"metrics":return`<div class="ametrics">${b.items.map(m=>
      `<div class="ametric"><b>${esc(String(m.v))}</b><span>${esc(m.l)}</span></div>`).join("")}</div>`;
    case"actions":return b.items&&b.items.length?`<div class="aactions">${b.items.map(a=>
      `<button class="btn ${a.style||"ghost"} small" onclick="echoChip('${esc(a.cmd).replace(/'/g,"\\'")}')">${esc(a.label)}</button>`).join("")}</div>`:"";
    case"confirm":{
      if(b.resolved)return`<div class="aconfirm"><div class="ch">${b.resolved==="approved"?"Approved":"Cancelled"}</div></div>`;
      return`<div class="aconfirm">
        <div class="ch">${esc(b.title||"Echo will")}</div>

          <div class="cmeta"><span><b>Permission:</b> ${b.perms&&b.perms.length?esc(b.perms.join(", ")):"none needed"} · available</span>
            <span><b>Autonomy:</b> ${esc(b.autonomy)}</span></div>

    case"blocked":return`<div class="ablocked"><div class="bt">Blocked — nothing performed</div>
      <div class="brow"><b>What</b><span>${esc(b.what)}</span></div>
      <div class="brow"><b>Why</b><span>${esc(b.why)}</span></div>
      <div class="brow"><b>Required</b><span>${esc(b.need)}</span></div>

    case"verify":return`<div class="averify">

      ${b.rows.map(r=>`<div class="vrow"><span>${esc(r.k)}</span>
        <span class="${r.ok?"vok":"vfail"}">${r.ok?"ON":"FAILED"}</span></div>`).join("")}</div>`;

function msgHTML(m){
  if(m.who==="user")return`<div class="msg user"><div class="mb">${esc(m.text)}</div></div>`;

      <div class="steps"><div class="sh">${e.done?(e.ok?"Complete":"Finished with errors"):"Echo is working"}</div>

function renderAgent(){

      <div style="flex:1;min-width:0"><div class="an">Echo</div>

      <button class="icobtn" onclick="closeEcho()" aria-label="Close">${ICON.x}</button>
    </div>
    <div class="agent-body" id="abody">

    </div>
    <div class="agent-foot">
      ${ECHO.messages.length<=1?`<div class="suggest">${ECHO_SUGGEST.map(s=>
        `<button onclick="echoChip('${esc(s).replace(/'/g,"\\'")}')">${esc(s)}</button>`).join("")}</div>`:""}
      <div class="ainput">
        <textarea id="aq" rows="1" placeholder="Ask Echo anything…" onkeydown="echoKey(event)"

        <button class="mic ${S.listening?"rec":""}" onclick="startVoice()" aria-label="Voice">🎙</button>
        <button class="asend" onclick="echoSubmit()" aria-label="Send">${ICON.send}</button>
      </div>
    </div></div>`;
  const b=$("abody"); if(b)b.scrollTop=b.scrollHeight;
  const o=$("orb"); if(o){o.dataset.state=ECHO.state;

    if(n>0){ if(bd)bd.textContent=n; else o.insertAdjacentHTML("beforeend",`<span class="badgeN">${n}</span>`);}
    else if(bd)bd.remove();}
}

  if(lines.length<=2)lines.push({v:'<span class="dim">Nothing pending. Ask me for anything.</span>'});
  return `<button class="estatus" onclick="openEcho()" aria-label="Open Echo">
    <div class="eh"><div class="eorb">${ICON.spark}</div>
      <div style="flex:1;min-width:0"><div class="etitle">Echo</div>
        <div class="esub"><span class="statusdot ${ECHO.state}"></span>System online · ${esc(
          {idle:"ready",thinking:"thinking",executing:"executing",waiting:"waiting for you",blocked:"blocked"}[ECHO.state]||"ready")}</div></div>
    </div>
    <div class="elines">${lines.slice(0,5).map(l=>`<div class="eline"><i></i><span>${l.v}</span></div>`).join("")}</div>
    <div class="ecta"><span>Ask Echo anything</span><span>→</span></div></button>`;
}

/* ══════════════ BOOT — restore, read real permissions, go live ══════════════ */
(async function boot(){
  const restored=restore();
  await DEVICE.refresh();
  startAmbientSignals();
  API.health().then(()=>render());
  setInterval(()=>{API.health().then(ok=>{if(S.tab==="home")render();});},20000);
  if(S.caps.location&&DEVICE.state.location==="granted")startGeofencing();
  scheduleTimeTriggers();
  if(restored)log("info","Session restored from this device — "+S.automations.length+
    " automation(s), "+S.commitments.length+" commitment(s). Nothing left the browser.");
  render();
})();
render();
</script>
