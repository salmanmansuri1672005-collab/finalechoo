<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080A0F">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23080A0F%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%228%22 fill=%22none%22 stroke=%22%238B5CF6%22 stroke-width=%222%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%223%22 fill=%22%2322D3EE%22/%3E%3C/svg%3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="EchoOS">
<title>EchoOS 2.0 — Ambient AI Operating System</title>
<style>
/* ══════════════════════════════════════════════════════════════
   ECHOOS 2.0 — AMBIENT AI OPERATING SYSTEM
   Dark ambient design system. Every class name from 1.x is kept so
   existing screens keep rendering; only the visual language changes.
   ══════════════════════════════════════════════════════════════ */
:root{
  --bg:#080A0F; --surface:#11151D; --elev:#171C26; --elev2:#1E2431;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.13);
  --text:#E8ECF4; --muted:#8A93A6; --dim:#596174;
  --violet:#8B5CF6; --cyan:#22D3EE; --mint:#34D399; --amber:#F59E0B; --rose:#F43F5E;
  --a1:#8B5CF6; --a2:#22D3EE;
  /* ambient-field colours — deliberately NOT tied to --a1/--a2 so that
     changing tabs never snaps the background mid-animation */
  --f1:#8B5CF6; --f2:#22D3EE; --f3:#4C1D95; --f4:#1E3A8A;
  --good:var(--mint); --warn:var(--amber); --bad:var(--rose); --info:var(--cyan);
  --s1:#8B5CF6; --s2:#22D3EE; --s3:#34D399; --s4:#F59E0B;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.35);
  --glow:0 0 0 1px rgba(139,92,246,.25),0 8px 30px rgba(139,92,246,.16);
  --r:16px; --r-lg:22px;
  --ff:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
/* palettes retune the accent pair + ambient field */
body[data-palette="aurora"]{--a1:#8B5CF6;--a2:#22D3EE;--f1:#8B5CF6;--f2:#22D3EE;--f3:#4C1D95;--f4:#1E3A8A}
body[data-palette="flux"]  {--a1:#22D3EE;--a2:#34D399;--f1:#22D3EE;--f2:#34D399;--f3:#0E7490;--f4:#065F46}
body[data-palette="ember"] {--a1:#F59E0B;--a2:#F43F5E;--f1:#F59E0B;--f2:#F43F5E;--f3:#7C2D12;--f4:#831843}
body[data-accent="home"]  {--a1:#8B5CF6;--a2:#22D3EE}
body[data-accent="modes"] {--a1:#A78BFA;--a2:#8B5CF6}
body[data-accent="lens"]  {--a1:#22D3EE;--a2:#67E8F9}
body[data-accent="plan"]  {--a1:#34D399;--a2:#22D3EE}
body[data-accent="create"]{--a1:#8B5CF6;--a2:#A78BFA}
body[data-accent="more"]  {--a1:#818CF8;--a2:#22D3EE}
body[data-palette="flux"][data-accent="home"]{--a1:#22D3EE;--a2:#34D399}
body[data-palette="ember"][data-accent="home"]{--a1:#F59E0B;--a2:#F43F5E}
/* optional light mode (kept from 1.x for accessibility) */
body[data-theme="light"]{
  --bg:#F6F7FA; --surface:#FFFFFF; --elev:#FFFFFF; --elev2:#F1F3F8;
  --line:rgba(12,16,26,.09); --line2:rgba(12,16,26,.16);
  --text:#0F1521; --muted:#5B6478; --dim:#8A93A6;
  --shadow:0 1px 2px rgba(16,20,30,.05),0 10px 28px rgba(16,20,30,.08);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--ff);background:var(--bg);color:var(--text);
  display:flex;flex-direction:column;max-width:460px;margin:0 auto;position:relative;
  overflow:hidden;-webkit-font-smoothing:antialiased;
  border-left:1px solid var(--line);border-right:1px solid var(--line);
  transition:background .4s,color .3s}
/* premium device frame on desktop */
@media (min-width:900px) and (min-height:760px){
  html{background:radial-gradient(1200px 700px at 50% -10%,#141A27,#05070B 62%)}
  body{height:calc(100vh - 56px);margin:28px auto;border-radius:34px;border:1px solid var(--line2);
    box-shadow:0 40px 120px rgba(0,0,0,.7),0 0 0 10px #0B0E15,0 0 0 11px rgba(255,255,255,.05)}
  body[data-theme="light"]{box-shadow:0 40px 120px rgba(20,26,40,.35),0 0 0 10px #E7EAF1,0 0 0 11px rgba(0,0,0,.06)}
}
/* ambient field */
.bg{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
/* Each blob gets its own compositor layer (translateZ + will-change) so the
   blurred pixels are not re-rasterised under the header/nav backdrop-filter —
   that combination was the source of the flicker. Colours cross-fade. */
.bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.28;
  transform:translateZ(0);will-change:transform;backface-visibility:hidden;
  transition:background-color 1.1s ease,opacity 1.1s ease}
.bg i:nth-child(1){width:330px;height:330px;background-color:var(--f1);top:-135px;left:-95px;animation:d1 26s ease-in-out infinite}
.bg i:nth-child(2){width:300px;height:300px;background-color:var(--f2);top:26%;right:-120px;animation:d2 31s ease-in-out infinite}
.bg i:nth-child(3){width:360px;height:360px;background-color:var(--f3);bottom:-160px;left:-115px;animation:d3 35s ease-in-out infinite;opacity:.34}
.bg i:nth-child(4){width:220px;height:220px;background-color:var(--f4);bottom:12%;right:-75px;animation:d1 33s ease-in-out infinite reverse;opacity:.26}
/* the ONLY accent-linked blob: small, faint, and it cross-fades, so a tab
   change reads as a slow tint rather than a snap */
.bg i:nth-child(5){display:block;width:250px;height:250px;background-color:var(--a2);
  top:44%;left:-90px;opacity:.13;animation:d2 24s ease-in-out infinite}
.bg:after{content:"";position:absolute;inset:0;opacity:.5;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:34px 34px;
  mask-image:radial-gradient(120% 80% at 50% 0%,#000 20%,transparent 78%)}
@keyframes d1{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(48px,38px,0) scale(1.14)}}
@keyframes d2{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(-44px,-32px,0) scale(1.09)}}
@keyframes d3{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(40px,-40px,0) scale(1.07)}}
@media (prefers-reduced-motion:reduce){.bg i{animation:none}*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

header,main,nav,#mode-banner{position:relative;z-index:1}
header{padding:14px 18px 11px;flex-shrink:0;border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--bg) 72%,transparent);
  backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%)}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hrow>div:first-child{min-width:0;overflow:hidden}
h1{font-size:19px;font-weight:700;letter-spacing:-.025em;white-space:nowrap;color:var(--text)}
h1 .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:2px;
  background:var(--a2);box-shadow:0 0 10px var(--a2);animation:livedot 2.6s ease-in-out infinite}
@keyframes livedot{0%,100%{opacity:1}50%{opacity:.35}}
.tag{font-size:8px;color:var(--dim);letter-spacing:.19em;margin-top:3px;white-space:nowrap;text-transform:uppercase}
.hbtns{display:flex;gap:5px;align-items:center;flex-shrink:0}
.icobtn{width:31px;height:31px;border-radius:10px;border:1px solid var(--line);flex-shrink:0;
  background:var(--surface);color:var(--muted);font-size:13px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:.18s}
.icobtn:hover{color:var(--text);border-color:var(--line2);background:var(--elev)}
.icobtn:focus-visible,.btn:focus-visible,nav button:focus-visible{outline:2px solid var(--a2);outline-offset:2px}
#mode-banner{display:none;padding:8px 18px;font-size:11px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:#040609;background:linear-gradient(100deg,var(--a1),var(--a2));flex-shrink:0}
main{flex:1;overflow-y:auto;padding:16px;padding-bottom:96px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
main::-webkit-scrollbar{width:6px}main::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px}
main.anim>*{animation:rise .4s cubic-bezier(.2,.8,.25,1) backwards}
main.anim>*:nth-child(1){animation-delay:.02s}
main.anim>*:nth-child(2){animation-delay:.06s}
main.anim>*:nth-child(3){animation-delay:.1s}
main.anim>*:nth-child(4){animation-delay:.14s}
main.anim>*:nth-child(5){animation-delay:.18s}
main.anim>*:nth-child(6){animation-delay:.22s}
main.anim>*:nth-child(7){animation-delay:.26s}
main.anim>*:nth-child(8){animation-delay:.3s}
main.anim>*:nth-child(n+9){animation-delay:.34s}
.badges .badge{animation:rise .3s cubic-bezier(.2,.8,.25,1) backwards}
.badges .badge:nth-child(1){animation-delay:.03s}
.badges .badge:nth-child(2){animation-delay:.06s}
.badges .badge:nth-child(3){animation-delay:.09s}
.badges .badge:nth-child(4){animation-delay:.12s}
.badges .badge:nth-child(5){animation-delay:.15s}
.badges .badge:nth-child(6){animation-delay:.18s}
.badges .badge:nth-child(7){animation-delay:.21s}
.badges .badge:nth-child(n+8){animation-delay:.24s}
main.anim>*:nth-child(1){animation-delay:.02s}main.anim>*:nth-child(2){animation-delay:.05s}
main.anim>*:nth-child(3){animation-delay:.08s}main.anim>*:nth-child(4){animation-delay:.11s}
main.anim>*:nth-child(n+5){animation-delay:.14s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ── bottom navigation with elevated Echo orb ── */
nav{display:flex;align-items:flex-end;border-top:1px solid var(--line);flex-shrink:0;
  background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px);
  padding-bottom:env(safe-area-inset-bottom);position:relative}
nav button{flex:1;background:none;border:none;color:var(--dim);padding:9px 2px 11px;font-size:9.5px;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;
  transition:color .2s;font-family:inherit;letter-spacing:.02em}
nav button svg{width:19px;height:19px;stroke-width:1.8}
nav button.active{color:var(--text);font-weight:600}
nav button svg{transition:color .25s,transform .25s cubic-bezier(.2,.8,.25,1)}
nav button.active svg{color:var(--a2);transform:translateY(-1px)}
nav button.tabpop svg{animation:navPop .32s cubic-bezier(.34,1.56,.64,1)}
@keyframes navPop{0%{transform:scale(.65) translateY(-1px)}60%{transform:scale(1.2) translateY(-1px)}100%{transform:scale(1) translateY(-1px)}}
/* soft halo behind the active icon — a painted gradient, not a re-rasterised
   drop-shadow filter (that was flickering over the nav's backdrop blur) */
nav button.active:before{content:"";position:absolute;top:3px;left:50%;width:36px;height:36px;
  margin-left:-18px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,color-mix(in srgb,var(--a2) 30%,transparent),transparent 68%)}
nav button.active:after{content:"";position:absolute;top:0;left:32%;right:32%;height:2px;border-radius:0 0 3px 3px;
  background:linear-gradient(90deg,var(--a1),var(--a2));
  box-shadow:0 1px 8px color-mix(in srgb,var(--a2) 45%,transparent)}
nav button span{transition:opacity .2s}
nav .echo-slot{flex:1;display:flex;justify-content:center;align-items:flex-start;position:relative}
/* Echo mark: 44px (was 52) — present without dominating the bar */
/* flex:0 0 44px is REQUIRED: `nav button{flex:1}` above also matches .orb
   (it is a <button> inside <nav>) and flex-basis:0% would otherwise beat the
   declared width, stretching the mark into an ellipse. */
.orb{flex:0 0 44px;padding:0;flex-direction:row;gap:0;
  width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;margin-top:-15px;
  background:linear-gradient(152deg,var(--a1),var(--a2));position:relative;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  box-shadow:0 0 0 4px var(--bg),0 5px 16px color-mix(in srgb,var(--a1) 42%,transparent),
    inset 0 1px 1px rgba(255,255,255,.45);
  transition:transform .24s cubic-bezier(.2,.85,.25,1),box-shadow .3s}
.orb:hover{transform:translateY(-2px) scale(1.06);
  box-shadow:0 0 0 4px var(--bg),0 9px 22px color-mix(in srgb,var(--a1) 55%,transparent),
    inset 0 1px 1px rgba(255,255,255,.5)}
.orb:active{transform:scale(.94)}
.orb svg{width:18px;height:18px;color:#05070B;stroke-width:2.3;position:relative;z-index:1}
/* glass highlight across the top of the sphere */
.orb:after{content:"";position:absolute;inset:1.5px;border-radius:50%;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,.04) 52%,transparent 70%)}
.orb:before{content:"";position:absolute;inset:-5px;border-radius:50%;pointer-events:none;
  border:1px solid color-mix(in srgb,var(--a2) 50%,transparent);opacity:.5;animation:orbring 3.6s ease-out infinite}
@keyframes orbring{0%{transform:scale(.94);opacity:.55}70%{transform:scale(1.3);opacity:0}100%{opacity:0}}
.orb[data-state="thinking"]{background:linear-gradient(150deg,#8B5CF6,#A78BFA)}
.orb[data-state="executing"]{background:linear-gradient(150deg,#22D3EE,#67E8F9)}
.orb[data-state="waiting"]{background:linear-gradient(150deg,#F59E0B,#FBBF24)}
.orb[data-state="blocked"]{background:linear-gradient(150deg,#F43F5E,#FB7185)}
.orb[data-state="thinking"] svg,.orb[data-state="executing"] svg{animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.orb .badgeN{position:absolute;top:-2px;right:-2px;min-width:15px;height:15px;border-radius:8px;z-index:2;
  background:var(--rose);color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;
  justify-content:center;padding:0 4px;border:2px solid var(--bg);
  box-shadow:0 2px 8px color-mix(in srgb,var(--rose) 55%,transparent)}

/* ── typography & primitives ── */
h2{font-size:19px;margin-bottom:5px;letter-spacing:-.03em;font-weight:700}
h3{font-size:13px;margin-bottom:3px;font-weight:650;letter-spacing:-.01em}
.sub{font-size:12.5px;color:var(--muted);margin-bottom:14px;line-height:1.6}
.eyebrow{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);
  font-weight:600;margin-bottom:7px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 15px;margin-bottom:9px;box-shadow:var(--shadow)}
.card.glow{border-color:color-mix(in srgb,var(--a1) 40%,transparent);box-shadow:var(--glow)}
/* :not(.btn) matters — without it this rule out-specifies `.btn{color:#05070B}`
   and every solid button inside a card renders with grey text. */
.card .small:not(.btn){font-size:12px;color:var(--muted);line-height:1.6}
.row{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:10px}
.flexrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn{background:linear-gradient(100deg,color-mix(in srgb,var(--a1) 74%,#fff),
  color-mix(in srgb,var(--a2) 80%,#fff));border:none;color:#05070B;border-radius:11px;
  padding:9px 15px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;
  transition:.16s;letter-spacing:-.01em}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:var(--elev);border:1px solid var(--line2);color:var(--text)}
.btn.ghost:hover{background:var(--elev2);filter:none}
.btn.small{padding:6px 11px;font-size:11.5px;border-radius:9px}
.btn.danger{background:transparent;border:1px solid color-mix(in srgb,var(--rose) 45%,transparent);color:var(--rose)}
.btn.danger:hover{background:color-mix(in srgb,var(--rose) 12%,transparent);filter:none}
.btn:disabled{opacity:.4;cursor:default;transform:none;filter:none}
.chip{display:inline-block;font-size:10px;padding:3.5px 9px;border-radius:8px;border:1px solid var(--line);
  color:var(--muted);margin:2px 5px 2px 0;background:var(--elev);letter-spacing:.01em;font-weight:500}
.chip.ok{border-color:color-mix(in srgb,var(--mint) 40%,transparent);color:var(--mint);background:color-mix(in srgb,var(--mint) 11%,transparent);
  animation:chipConfirm .4s ease}
@keyframes chipConfirm{0%{transform:scale(.7);opacity:.3}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.chip.err{border-color:color-mix(in srgb,var(--rose) 40%,transparent);color:var(--rose);background:color-mix(in srgb,var(--rose) 11%,transparent)}
.chip.sim{border-color:color-mix(in srgb,var(--amber) 40%,transparent);color:var(--amber);background:color-mix(in srgb,var(--amber) 11%,transparent)}
.chip.pri{border-color:color-mix(in srgb,var(--a2) 42%,transparent);color:var(--a2);background:color-mix(in srgb,var(--a2) 11%,transparent)}
textarea,input[type=text]{width:100%;background:var(--elev);border:1px solid var(--line);border-radius:12px;
  color:var(--text);padding:11px 13px;font-size:14px;font-family:inherit;resize:vertical}
textarea::placeholder,input::placeholder{color:var(--dim)}
textarea:focus,input:focus{outline:none;border-color:color-mix(in srgb,var(--a2) 60%,transparent);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--a2) 14%,transparent)}
.seg{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:52px;background:var(--elev);border:1px solid var(--line);color:var(--muted);
  border-radius:10px;padding:7px 4px;font-size:11.5px;cursor:pointer;transition:.16s;font-family:inherit}
.seg button:hover{color:var(--text);border-color:var(--line2)}
.seg button.sel{border-color:transparent;color:#05070B;font-weight:700;
  background:linear-gradient(100deg,color-mix(in srgb,var(--a1) 74%,#fff),
    color-mix(in srgb,var(--a2) 80%,#fff))}
.toggle{position:relative;width:42px;height:23px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle .tr{position:absolute;inset:0;background:var(--elev2);border:1px solid var(--line2);
  border-radius:99px;transition:.18s;cursor:pointer}
.toggle .tr:before{content:"";position:absolute;width:15px;height:15px;border-radius:50%;
  background:var(--dim);top:3px;left:4px;transition:transform .32s cubic-bezier(.34,1.56,.64,1),background .18s}
.toggle input:checked + .tr{background:linear-gradient(100deg,var(--a1),var(--a2));border-color:transparent}
.toggle input:checked + .tr:before{transform:translateX(19px);background:#05070B}
.kv{font-size:12.5px;line-height:1.75;color:var(--muted)}
.kv b{font-weight:600;color:var(--text)}
.conf{height:4px;background:var(--elev2);border-radius:4px;margin-top:8px;overflow:hidden}
.conf i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--a1),var(--a2));
  transition:width .7s cubic-bezier(.2,.8,.25,1)}
.empty{font-size:12.5px;color:var(--dim);padding:24px 6px;text-align:center;line-height:1.6}
.stat-row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:13px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:11px 2px 9px;
  text-align:center;min-width:0}
.stat b{font-size:18px;display:block;font-variant-numeric:tabular-nums;letter-spacing:-.03em;color:var(--text)}
.stat span{font-size:7.5px;color:var(--dim);letter-spacing:.11em;text-transform:uppercase;white-space:nowrap}
.log-line{font-size:12px;padding:9px 12px;border-left:2px solid var(--line2);background:var(--surface);
  border-radius:0 11px 11px 0;margin-bottom:5px;line-height:1.6;color:var(--muted)}
.log-line.ok{border-left-color:var(--mint)}.log-line.err{border-left-color:var(--rose)}
.log-line.sug{border-left-color:var(--amber)}.log-line.info{border-left-color:var(--a2)}
.log-line time{color:var(--dim);font-size:9.5px;display:block;letter-spacing:.08em;margin-bottom:2px;
  font-variant-numeric:tabular-nums;text-transform:uppercase}
.block{display:flex;gap:9px;margin-bottom:6px}
.block .t{width:76px;font-size:10.5px;color:var(--dim);text-align:right;padding-top:11px;flex-shrink:0;
  font-variant-numeric:tabular-nums}
.block .b{flex:1;border-radius:13px;padding:9px 12px;font-size:13px;border:1px solid var(--line);background:var(--surface)}
.block .b .k{font-size:9.5px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.block.fixed .b{background:color-mix(in srgb,var(--violet) 14%,var(--surface));border-color:color-mix(in srgb,var(--violet) 32%,transparent)}
.block.commitment .b{background:color-mix(in srgb,var(--mint) 12%,var(--surface));border-color:color-mix(in srgb,var(--mint) 30%,transparent)}
.block.break .b{background:transparent;border-style:dashed;color:var(--dim)}
.mode-card{border-radius:var(--r);padding:14px 15px;margin-bottom:9px;border:1px solid var(--line);
  background:var(--surface);box-shadow:var(--shadow);transition:.22s}
.mode-card.on{border-color:color-mix(in srgb,var(--a1) 45%,transparent);
  background:linear-gradient(150deg,color-mix(in srgb,var(--a1) 13%,var(--surface)),var(--surface));
  box-shadow:var(--glow)}
.mode-ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  background:var(--elev2);border:1px solid var(--line);font-size:18px;flex-shrink:0}
.mode-card.on .mode-ic{background:linear-gradient(140deg,color-mix(in srgb,var(--a1) 30%,transparent),transparent);
  border-color:color-mix(in srgb,var(--a1) 40%,transparent)}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(10px);width:min(420px,88%);
  background:var(--elev2);border:1px solid var(--line2);color:var(--text);border-radius:13px;padding:11px 14px;
  font-size:12.5px;z-index:120;box-shadow:0 18px 46px rgba(0,0,0,.6);display:none;opacity:0;
  transition:opacity .25s,transform .25s;backdrop-filter:blur(14px)}
.toast.show{display:block;opacity:1;transform:translateX(-50%) translateY(0)}
.toast b{color:var(--a2)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:130;display:none}
.legend{display:flex;flex-wrap:wrap;gap:9px;margin-top:10px;font-size:11px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}
.hero-num{font-size:34px;font-weight:700;letter-spacing:-.04em;line-height:1;
  background:linear-gradient(100deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
table.dv{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:10px}
table.dv th,table.dv td{text-align:left;padding:6px;border-bottom:1px solid var(--line)}
table.dv th{color:var(--dim);font-weight:600;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase}
table.dv td{color:var(--muted)}
table.dv td:last-child,table.dv th:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--text)}
.stat-mini{display:flex;gap:14px;margin:4px 0 10px;font-size:11px;color:var(--dim)}
.stat-mini b{color:var(--text)}
.about-card{background:color-mix(in srgb,var(--a1) 10%,var(--surface));
  border:1px solid color-mix(in srgb,var(--a1) 32%,transparent);border-radius:14px;padding:13px 15px;
  margin-bottom:12px;font-size:12.5px;line-height:1.65;color:var(--muted)}
.about-card b{display:block;font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--a2);margin-bottom:5px}
.demo-step{background:var(--elev);border-radius:10px;padding:9px 11px;margin-bottom:6px;font-size:12.5px;
  display:flex;gap:8px;align-items:center;color:var(--muted)}
.demo-step .n{width:19px;height:19px;border-radius:6px;background:linear-gradient(140deg,var(--a1),var(--a2));
  color:#05070B;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
/* radar */
.radar{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.sweep{transform-origin:60px 60px;animation:spin 4.5s linear infinite}
.blip{animation:blipPulse 2.6s ease-in-out infinite}
@keyframes blipPulse{0%,100%{opacity:.45}50%{opacity:1}}
/* flow diagram */
.flow{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-top:9px}
.flow .node{font-size:10.5px;padding:5px 9px;border-radius:8px;border:1px solid var(--line);
  background:var(--elev);white-space:nowrap;color:var(--muted)}
.flow .node.trg{background:linear-gradient(100deg,color-mix(in srgb,var(--a1) 26%,transparent),
  color-mix(in srgb,var(--a2) 20%,transparent));color:var(--text);
  border-color:color-mix(in srgb,var(--a1) 40%,transparent);font-weight:600}
.flow .arw{color:var(--dim);font-size:10px}
/* badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:7px;margin-top:10px}
.badge{text-align:center;padding:10px 5px;border-radius:12px;border:1px solid var(--line);
  background:var(--elev);transition:.25s}
.badge.on{border-color:color-mix(in srgb,var(--a1) 42%,transparent);
  background:linear-gradient(150deg,color-mix(in srgb,var(--a1) 18%,transparent),var(--elev))}
.badge .bi{font-size:18px;display:block;filter:grayscale(1);opacity:.32}
.badge.on .bi{filter:none;opacity:1}
.badge.pop{animation:badgePop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes badgePop{0%{transform:scale(.4);opacity:.4}60%{transform:scale(1.16)}100%{transform:scale(1);opacity:1}}
.badge .bn{font-size:8.5px;font-weight:650;margin-top:4px;letter-spacing:.02em;color:var(--muted)}
.badge.on .bn{color:var(--text)}
/* command palette */
.cmdwrap{position:fixed;inset:0;z-index:140;background:rgba(4,6,11,.66);backdrop-filter:blur(7px);
  display:none;padding-top:70px;justify-content:center}
.cmdwrap.open{display:flex;animation:cmdFade .38s ease}
@keyframes cmdFade{from{opacity:0}to{opacity:1}}
.cmd{width:min(430px,92%);height:max-content;max-height:70vh;background:var(--elev);
  border:1px solid var(--line2);border-radius:18px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.7)}
.cmdwrap.open .cmd{animation:cmdPop .45s cubic-bezier(.2,.9,.25,1)}
@keyframes cmdPop{from{opacity:0;transform:translateY(-40px) scale(.85)}to{opacity:1;transform:none}}
.cmd input{width:100%;border:none;border-bottom:1px solid var(--line);border-radius:0;background:transparent;
  padding:14px 16px;font-size:14.5px;color:var(--text)}
.cmd input:focus{outline:none;box-shadow:none}
.cmdlist{max-height:52vh;overflow-y:auto;padding:6px}
.cmditem{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;cursor:pointer;
  font-size:13px;color:var(--muted)}
.cmditem.sel{background:linear-gradient(100deg,color-mix(in srgb,var(--a1) 22%,transparent),
  color-mix(in srgb,var(--a2) 14%,transparent));color:var(--text);font-weight:600}
.cmditem .ck{margin-left:auto;font-size:10px;color:var(--dim)}
.search{width:100%;background:var(--elev);border:1px solid var(--line);border-radius:11px;color:var(--text);
  padding:10px 14px;font-size:13px;margin-bottom:13px}
/* auth */
.auth{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:24px;overflow-y:auto;background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:blur(12px)}
.auth .panel{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line2);
  border-radius:24px;padding:24px 20px;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:rise .5s cubic-bezier(.2,.8,.25,1)}
.auth .brand{font-size:23px;font-weight:700;letter-spacing:-.03em;text-align:center;color:var(--text)}
.auth .brandsub{font-size:8.5px;letter-spacing:.19em;color:var(--dim);text-align:center;margin-top:4px;text-transform:uppercase}
.auth label{display:block;font-size:9.5px;font-weight:650;letter-spacing:.13em;text-transform:uppercase;
  color:var(--dim);margin:14px 0 6px}
.auth .err{font-size:11.5px;color:var(--rose);margin-top:7px}
.auth .note{font-size:11.5px;color:var(--dim);line-height:1.6;margin-top:14px;text-align:center}
.auth .linkbtn{background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;
  text-decoration:underline;padding:8px;font-family:inherit}
.avatar-lg{width:70px;height:70px;border-radius:22px;display:flex;align-items:center;justify-content:center;
  font-size:24px;font-weight:700;color:#05070B;margin:0 auto 6px;letter-spacing:-.02em;
  background:linear-gradient(140deg,var(--a1),var(--a2));box-shadow:0 8px 26px color-mix(in srgb,var(--a1) 40%,transparent)}
.avatar-sm{width:31px;height:31px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;color:#05070B;cursor:pointer;letter-spacing:-.02em;
  background:linear-gradient(140deg,var(--a1),var(--a2));border:none;flex-shrink:0}
.prow{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.prow:last-child{border-bottom:none}
.prow .pk{color:var(--dim);font-size:11.5px}
.prow .pv{font-weight:600;text-align:right;overflow-wrap:anywhere;color:var(--text)}
.mic{width:38px;height:38px;border-radius:12px;border:1px solid var(--line2);flex-shrink:0;cursor:pointer;
  background:var(--elev);color:var(--muted);display:flex;align-items:center;justify-content:center}
.mic.rec{border-color:var(--rose);color:var(--rose);animation:recording 1.1s infinite}
@keyframes recording{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.45)}50%{box-shadow:0 0 0 10px rgba(244,63,94,0)}}
/* hero / Echo avatar block (kept from 1.x, restyled) */
.hero{position:relative;display:flex;align-items:center;gap:6px;padding:14px;margin-bottom:13px;
  border-radius:var(--r-lg);overflow:hidden;border:1px solid color-mix(in srgb,var(--a1) 26%,transparent);
  background:linear-gradient(140deg,color-mix(in srgb,var(--a1) 15%,var(--surface)),var(--surface) 65%);
  box-shadow:var(--glow)}
.hero.mini{padding:11px 12px;gap:2px}
/* ── Echo avatar ──────────────────────────────────────────────────────
   Was a CSS-3D rig: transform-style:preserve-3d with a dozen translateZ
   children, rotated on X *and* Y, sitting inside a backdrop-filter
   ancestor. Browsers z-fight that stack every frame, which is exactly the
   flicker/tearing that was reported — and it got worse at the small
   .hero.mini size. It is now one inline SVG: same character, same moods,
   zero 3-D, pixel-crisp at any scale.                                   */
.bot-scene{width:88px;height:106px;flex-shrink:0;display:flex;align-items:center;justify-content:center;position:relative}
.hero.mini .bot-scene{width:66px;height:80px}
.bot{width:100%;height:100%;display:block;overflow:visible}
.bot .body{animation:float 6.5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 96%}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-4px) rotate(1.5deg)}}
.bot .shadow{fill:#000;animation:shs 6.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes shs{0%,100%{transform:scaleX(1);opacity:.42}50%{transform:scaleX(.8);opacity:.22}}
/* eyes — colour comes from botMood() via --eyeC and cross-fades */
.bot .eye{fill:var(--eyeC,#22D3EE);transform-box:fill-box;transform-origin:center;
  animation:blink 5.4s ease-in-out infinite;transition:fill .5s}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.12)}}
.bot .eyeglow{fill:var(--eyeC,#22D3EE);opacity:.24;transform-box:fill-box;transform-origin:center;
  animation:softpulse 3.4s ease-in-out infinite;transition:fill .5s}
@keyframes softpulse{0%,100%{opacity:.24;transform:scale(1)}50%{opacity:.42;transform:scale(1.14)}}
.bot.think .eye{animation:thinkeye 1.5s ease-in-out infinite}
@keyframes thinkeye{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6px)}}
.bot.sleep .eye{animation:none;transform:scaleY(.2)}
.bot.sleep .eyeglow{opacity:.13;animation:none}
.bot.alert .eye{animation:alerteye 1.4s ease-in-out infinite}
@keyframes alerteye{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
/* ── screen-specific bot moods (Create / Modes / EchoLens / Plan / Home) ── */
.bot.justarrived .arm-r{animation:bigwave .9s ease-in-out 1}
@keyframes bigwave{0%,100%{transform:rotate(3deg)}30%{transform:rotate(-38deg)}60%{transform:rotate(22deg)}}
.bot.write .arm-r{animation:writegesture 1.1s ease-in-out infinite}
@keyframes writegesture{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(20deg)}}
.bot-scene:has(.bot.write)::after{content:"✏️";position:absolute;right:2px;bottom:14px;font-size:13px;
  animation:writeblink 1.1s steps(2) infinite}
@keyframes writeblink{50%{opacity:.15}}
.bot.scan .eye{animation:scaneye 1.8s ease-in-out infinite}
@keyframes scaneye{0%,100%{transform:translateX(-2px)}50%{transform:translateX(2px)}}
.bot-scene:has(.bot.scan)::before{content:"";position:absolute;left:10%;right:10%;height:2px;
  background:linear-gradient(90deg,transparent,var(--a2),transparent);top:22%;
  animation:scansweep 1.8s ease-in-out infinite;pointer-events:none}
@keyframes scansweep{0%{top:18%;opacity:.2}50%{top:72%;opacity:1}100%{top:18%;opacity:.2}}
.bot-scene:has(.bot.plan-nod)::after{content:"✓";position:absolute;right:2px;top:6px;width:16px;height:16px;
  border-radius:50%;background:var(--mint);color:#05070B;font-size:10px;font-weight:800;display:flex;
  align-items:center;justify-content:center;animation:checkpop 1.7s ease-in-out infinite}
@keyframes checkpop{0%,100%{transform:scale(.85);opacity:.55}50%{transform:scale(1.12);opacity:1}}
@media (prefers-reduced-motion:reduce){
  .bot.justarrived .arm-r,.bot.write .arm-r,.bot.scan .eye{animation:none}
  .bot-scene:has(.bot.write)::after,.bot-scene:has(.bot.scan)::before,.bot-scene:has(.bot.plan-nod)::after{animation:none}
}
/* antenna bulb + chest core */
.bot .bulb{fill:var(--eyeC,#22D3EE);transform-box:fill-box;transform-origin:center;
  animation:corepulse 2.2s ease-in-out infinite;transition:fill .5s}
.bot .core{fill:var(--eyeC,#22D3EE);transform-box:fill-box;transform-origin:center;
  animation:corepulse 2.9s ease-in-out infinite;transition:fill .5s}
@keyframes corepulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(.87)}}
.bot .halo{fill:var(--eyeC,#22D3EE);opacity:.2;transform-box:fill-box;transform-origin:center;
  animation:softpulse 2.6s ease-in-out infinite;transition:fill .5s}
.bot .arm-r{transform-box:fill-box;transform-origin:50% 6%;animation:wave 6.5s ease-in-out infinite}
@keyframes wave{0%,52%,100%{transform:rotate(3deg)}66%,82%{transform:rotate(-32deg)}}

.bot .rim{fill:none;stroke:rgba(255,255,255,.11);stroke-width:1}
@media (prefers-reduced-motion:reduce){ 
  .bot .body,.bot .shadow,.bot .eye,.bot .eyeglow,.bot .bulb,.bot .core,.bot .halo,.bot .arm-r{animation:none}
} 
.bubble{flex:1;min-width:0}
.bubble .say{position:relative;background:var(--elev);border:1px solid var(--line);border-radius:14px;
  padding:10px 12px;font-size:12px;line-height:1.6;margin-top:7px;color:var(--muted)}
.hero.mini .bubble .say{margin-top:0;font-size:11.5px}
.bubble .say:before{content:"";position:absolute;left:-6px;top:14px;width:10px;height:10px;background:var(--elev);
  border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.bubble .say b{color:var(--a2);font-weight:600} 

/* ══════════════════════════════════════════════════════════════ 
   ECHO AGENT — command surface
   ══════════════════════════════════════════════════════════════ */
.agentwrap{position:fixed;inset:0;z-index:150;display:none;background:rgba(4,6,11,.6);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.agentwrap.open{display:block;animation:fadein .22s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.agent{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:min(460px,100%);
  height:min(88vh,760px);background:var(--bg);border:1px solid var(--line2);border-bottom:none;
  border-radius:26px 26px 0 0;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 -20px 70px rgba(0,0,0,.65);animation:sheetup .34s cubic-bezier(.2,.9,.25,1)}
@keyframes sheetup{from{transform:translateX(-50%) translateY(30px);opacity:.4}to{transform:translateX(-50%) translateY(0);opacity:1}}
.agent:before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(90% 40% at 50% 0%,color-mix(in srgb,var(--a1) 16%,transparent),transparent 70%)}
.agent-head{display:flex;align-items:center;gap:11px;padding:15px 17px 12px;border-bottom:1px solid var(--line);
  position:relative;z-index:1;flex-shrink:0}
.agent-mark{width:34px;height:34px;border-radius:11px;flex-shrink:0;position:relative;
  background:linear-gradient(140deg,var(--a1),var(--a2));display:flex;align-items:center;justify-content:center}
.agent-mark svg{width:17px;height:17px;color:#05070B;stroke-width:2.2}
.agent-mark.thinking{animation:markpulse 1.5s ease-in-out infinite}
@keyframes markpulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--a1) 55%,transparent)}
  50%{box-shadow:0 0 0 9px transparent}}
.agent-head .an{font-size:14px;font-weight:650;letter-spacing:-.01em}
.agent-head .as{font-size:10.5px;color:var(--dim);display:flex;align-items:center;gap:5px;margin-top:1px}
.statusdot{width:6px;height:6px;border-radius:50%;background:var(--mint);box-shadow:0 0 8px var(--mint)}
.statusdot.thinking{background:var(--violet);box-shadow:0 0 8px var(--violet)}
.statusdot.executing{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.statusdot.waiting{background:var(--amber);box-shadow:0 0 8px var(--amber)}
.statusdot.blocked{background:var(--rose);box-shadow:0 0 8px var(--rose)}
.agent-body{flex:1;overflow-y:auto;padding:14px 16px 8px;position:relative;z-index:1;scrollbar-width:thin}
.agent-body::-webkit-scrollbar{width:5px}.agent-body::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px}
.agent-foot{border-top:1px solid var(--line);padding:11px 14px calc(12px + env(safe-area-inset-bottom));
  position:relative;z-index:1;flex-shrink:0;background:color-mix(in srgb,var(--bg) 92%,transparent)}
.ainput{display:flex;gap:8px;align-items:flex-end}
.ainput textarea{flex:1;min-height:42px;max-height:110px;border-radius:14px;padding:11px 13px;font-size:14px;
  background:var(--elev);resize:none;line-height:1.4}
.asend{width:42px;height:42px;border-radius:14px;border:none;flex-shrink:0;cursor:pointer;
  background:linear-gradient(140deg,color-mix(in srgb,var(--a1) 78%,#fff),
    color-mix(in srgb,var(--a2) 84%,#fff));display:flex;align-items:center;justify-content:center;
  transition:.16s}
.asend:hover{filter:brightness(1.1)}
.asend:disabled{opacity:.35;cursor:default}
.asend svg{width:18px;height:18px;color:#05070B;stroke-width:2.2}
/* messages */
.msg{margin-bottom:13px;animation:rise .3s cubic-bezier(.2,.8,.25,1)}
.msg.user{display:flex;justify-content:flex-end}
.msg.user .mb{background:linear-gradient(100deg,color-mix(in srgb,var(--a1) 26%,transparent),
  color-mix(in srgb,var(--a2) 18%,transparent));border:1px solid color-mix(in srgb,var(--a1) 30%,transparent);
  border-radius:15px 15px 4px 15px;padding:9px 13px;font-size:13.5px;max-width:82%;color:var(--text);line-height:1.5}
.msg.echo .mrow{display:flex;gap:9px;align-items:flex-start}
.msg.echo .mav{width:24px;height:24px;border-radius:8px;flex-shrink:0;margin-top:1px;
  background:linear-gradient(140deg,var(--a1),var(--a2));display:flex;align-items:center;justify-content:center}
.msg.echo .mav svg{width:12px;height:12px;color:#05070B;stroke-width:2.4}
.msg.echo .mc{flex:1;min-width:0}
.msg.echo .mt{font-size:13.5px;line-height:1.62;color:var(--text)}
.msg.echo .mt b{color:var(--a2);font-weight:600}
.msg.echo .mt .dim{color:var(--dim)}
/* typing */
.typing{display:flex;gap:4px;padding:6px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--a2);animation:typ 1.2s infinite}
.typing i:nth-child(2){animation-delay:.16s}.typing i:nth-child(3){animation-delay:.32s}
@keyframes typ{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
/* execution steps */
.steps{margin-top:9px;border:1px solid var(--line);border-radius:13px;background:var(--surface);overflow:hidden}
.steps .sh{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
  padding:9px 12px 7px;border-bottom:1px solid var(--line);font-weight:600}
.step{display:flex;align-items:center;gap:9px;padding:7px 12px;font-size:12px;color:var(--dim)}
.step .si{width:14px;flex-shrink:0;text-align:center;font-size:11px}
.step.done{color:var(--muted)}.step.done .si{color:var(--mint)}
.step.now{color:var(--text)}.step.now .si{color:var(--a2)}
.step.now .si svg{animation:spin 1.1s linear infinite}
.step.fail{color:var(--rose)}.step.fail .si{color:var(--rose)}
/* agent cards / lists / metrics */
.alist{margin-top:9px;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:var(--surface)}
.alist .ai{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-bottom:1px solid var(--line);font-size:12.5px}
.alist .ai:last-child{border-bottom:none}
.alist .ai .aidx{width:17px;height:17px;border-radius:6px;background:var(--elev2);color:var(--dim);
  font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.alist .ai .ait{flex:1;min-width:0;color:var(--text);line-height:1.5}
.alist .ai .aim{font-size:11px;color:var(--dim);margin-top:2px}
.ametrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:7px;margin-top:9px}
.ametric{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
.ametric b{display:block;font-size:17px;letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--text)}
.ametric span{font-size:8.5px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase}
.aactions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.aactions .btn{font-size:11.5px;padding:7px 12px}
/* confirmation / preview */
.aconfirm{margin-top:10px;border:1px solid color-mix(in srgb,var(--amber) 38%,transparent);border-radius:14px;
  background:color-mix(in srgb,var(--amber) 8%,var(--surface));overflow:hidden}
.aconfirm .ch{padding:10px 13px 8px;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--amber);font-weight:650;border-bottom:1px solid color-mix(in srgb,var(--amber) 22%,transparent)}
.aconfirm .cb{padding:11px 13px}
.aconfirm ol{margin:0 0 0 16px;font-size:12.5px;color:var(--text);line-height:1.7}
.aconfirm .cmeta{display:flex;gap:14px;font-size:11px;color:var(--dim);margin-top:9px;flex-wrap:wrap}
.aconfirm .cmeta b{color:var(--muted);font-weight:600}
.ablocked{margin-top:10px;border:1px solid color-mix(in srgb,var(--rose) 38%,transparent);border-radius:14px;
  background:color-mix(in srgb,var(--rose) 8%,var(--surface));padding:12px 13px;font-size:12.5px;line-height:1.6}
.ablocked .bt{color:var(--rose);font-weight:650;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px}
.ablocked .brow{display:flex;gap:8px;font-size:12px;margin-top:4px;color:var(--muted)}
.ablocked .brow b{color:var(--text);font-weight:600;min-width:66px;flex-shrink:0}
.averify{margin-top:9px;border:1px solid color-mix(in srgb,var(--mint) 32%,transparent);border-radius:13px;
  background:color-mix(in srgb,var(--mint) 7%,var(--surface));padding:10px 13px;font-size:12.5px}
.averify .vrow{display:flex;justify-content:space-between;gap:10px;padding:3px 0;color:var(--muted)}
.averify .vrow b{color:var(--text);font-weight:600}
.averify .vok{color:var(--mint);font-weight:600}
.averify .vfail{color:var(--rose);font-weight:600}
/* suggested prompts */
.suggest{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px}
.suggest button{background:var(--elev);border:1px solid var(--line);border-radius:10px;color:var(--muted);
  font-size:11.5px;padding:7px 11px;cursor:pointer;font-family:inherit;transition:.16s;text-align:left}
.suggest button:hover{color:var(--text);border-color:color-mix(in srgb,var(--a2) 45%,transparent);background:var(--elev2)}
/* Echo status panel (Home) */
.estatus{border-radius:var(--r-lg);padding:0;margin-bottom:12px;overflow:hidden;cursor:pointer;
  border:1px solid color-mix(in srgb,var(--a1) 28%,transparent);
  background:linear-gradient(150deg,color-mix(in srgb,var(--a1) 14%,var(--surface)),var(--surface) 70%);
  box-shadow:var(--glow);transition:.2s;width:100%;text-align:left;font-family:inherit;display:block}
.estatus:hover{border-color:color-mix(in srgb,var(--a1) 48%,transparent);transform:translateY(-1px)}
.estatus .eh{display:flex;align-items:center;gap:11px;padding:14px 15px 11px}
.estatus .eorb{width:40px;height:40px;border-radius:13px;flex-shrink:0;position:relative;
  background:linear-gradient(140deg,var(--a1),var(--a2));display:flex;align-items:center;justify-content:center}
.estatus .eorb svg{width:19px;height:19px;color:#05070B;stroke-width:2.2}
.estatus .eorb:after{content:"";position:absolute;inset:-4px;border-radius:16px;
  border:1px solid color-mix(in srgb,var(--a2) 45%,transparent);animation:orbring 3.4s ease-out infinite}
.estatus .etitle{font-size:14px;font-weight:650;letter-spacing:-.01em}
.estatus .esub{font-size:10.5px;color:var(--dim);display:flex;align-items:center;gap:5px;margin-top:2px}
.estatus .elines{padding:0 15px 13px;display:flex;flex-direction:column;gap:5px}
.estatus .eline{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.estatus .eline i{width:5px;height:5px;border-radius:50%;background:var(--a2);flex-shrink:0}
.estatus .eline b{color:var(--text);font-weight:600}
.estatus .ecta{border-top:1px solid var(--line);padding:10px 15px;font-size:11.5px;color:var(--a2);
  display:flex;align-items:center;justify-content:space-between;font-weight:600}
/* attention list */
.attn{border:1px solid color-mix(in srgb,var(--amber) 30%,transparent);border-radius:var(--r);
  background:color-mix(in srgb,var(--amber) 7%,var(--surface));padding:13px 14px;margin-bottom:9px}
.attn .at{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);
  font-weight:650;margin-bottom:8px}
/* More hub */
.hub{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hubcard{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:14px 13px;
  cursor:pointer;text-align:left;font-family:inherit;transition:.18s;color:var(--text)}
.hubcard:hover{border-color:color-mix(in srgb,var(--a2) 42%,transparent);background:var(--elev);transform:translateY(-1px)}
.hubcard .hi{width:32px;height:32px;border-radius:10px;background:var(--elev2);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;margin-bottom:9px;color:var(--a2)}
.hubcard .hi svg{width:16px;height:16px;stroke-width:1.9}
.hubcard .hn{font-size:12.5px;font-weight:650;letter-spacing:-.01em}
.hubcard .hd{font-size:10.5px;color:var(--dim);margin-top:2px;line-height:1.45}
.backbtn{display:inline-flex;align-items:center;gap:6px;background:var(--elev);border:1px solid var(--line);
  color:var(--muted);border-radius:10px;padding:6px 11px;font-size:11.5px;cursor:pointer;
  font-family:inherit;margin-bottom:13px}
.backbtn:hover{color:var(--text);border-color:var(--line2)}
/* section header with rule */
.shead{display:flex;align-items:center;gap:10px;margin:18px 0 9px}
.shead .st{font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);font-weight:650;white-space:nowrap}
.shead .sl{flex:1;height:1px;background:var(--line)}

.scanline{position:relative;height:3px;border-radius:3px;background:var(--line);overflow:hidden;margin:12px 0 4px}
.scanline i{position:absolute;inset:0;width:38%;border-radius:3px;
  background:linear-gradient(90deg,transparent,var(--a2),transparent);animation:scanmove 1.1s ease-in-out infinite}
@keyframes scanmove{0%{transform:translateX(-110%)}100%{transform:translateX(320%)}}
.exchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.exchips button{background:var(--elev);border:1px solid var(--line);border-radius:10px;color:var(--muted);
  font-size:11.5px;padding:7px 11px;cursor:pointer;font-family:inherit;text-align:left;transition:.16s}
.exchips button:hover{color:var(--text);border-color:color-mix(in srgb,var(--a2) 45%,transparent)}
.prigroup{display:flex;align-items:center;gap:8px;margin:16px 0 8px}
.prigroup .pdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.prigroup .pn{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:650}
.prigroup .pc{margin-left:auto;font-size:10px;color:var(--dim)}

.acards{display:flex;flex-direction:column;gap:7px;margin-top:9px}
.acard{border:1px solid var(--line);border-radius:13px;background:var(--surface);padding:11px 12px}
.acard-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.acard-t{font-size:13px;font-weight:600;color:var(--text);line-height:1.4}
.acard-m{font-size:11px;color:var(--dim);margin-top:3px}
.acard .aactions{margin-top:9px}
.proactive{border:1px solid color-mix(in srgb,var(--amber) 34%,transparent);border-radius:13px;
  background:color-mix(in srgb,var(--amber) 7%,var(--surface));padding:11px 13px;margin-top:9px}
.proactive .pt{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);
  font-weight:650;margin-bottom:5px}

.tl{position:relative}
.tlrow{display:flex;gap:11px;align-items:stretch;margin-bottom:2px}
.tltime{width:52px;flex-shrink:0;text-align:right;padding-top:12px;font-size:11px;color:var(--text);
  font-variant-numeric:tabular-nums;line-height:1.25}
.tltime span{display:block;font-size:10px;color:var(--dim)}
.tlrail{width:14px;flex-shrink:0;position:relative;display:flex;justify-content:center}
.tlrail:before{content:"";position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.tlrow:first-child .tlrail:before{top:14px}
.tlrow:last-child .tlrail:before{bottom:calc(100% - 14px)}
.tldot{width:9px;height:9px;border-radius:50%;background:var(--elev2);border:2px solid var(--line2);
  margin-top:13px;position:relative;z-index:1;flex-shrink:0}
.tlrow.fixed .tldot{background:var(--s2);border-color:var(--s2);box-shadow:0 0 10px color-mix(in srgb,var(--s2) 55%,transparent)}
.tlrow.commitment .tldot{background:var(--s3);border-color:var(--s3);box-shadow:0 0 10px color-mix(in srgb,var(--s3) 55%,transparent)}
.tlrow.task .tldot{background:var(--s1);border-color:var(--s1)}
.tlbody{flex:1;min-width:0;border:1px solid var(--line);border-radius:13px;background:var(--surface);
  padding:9px 12px;margin-bottom:7px}
.tlrow.fixed .tlbody{background:color-mix(in srgb,var(--s2) 9%,var(--surface));
  border-color:color-mix(in srgb,var(--s2) 26%,transparent)}
.tlrow.commitment .tlbody{background:color-mix(in srgb,var(--s3) 9%,var(--surface));
  border-color:color-mix(in srgb,var(--s3) 26%,transparent)}
.tlrow.break .tlbody{background:transparent;border-style:dashed}
.tlt{font-size:13px;font-weight:600;color:var(--text);line-height:1.35}
.tlrow.break .tlt{color:var(--dim);font-weight:500}
.tlm{font-size:10.5px;color:var(--dim);margin-top:3px}
.ig{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:9px}
.igcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 12px}
.igcard .ign{font-size:22px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;
  background:linear-gradient(100deg,var(--a1),var(--a2));-webkit-background-clip:text;
  background-clip:text;color:transparent}
.igcard .igl{font-size:10px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.igcard .igd{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.5}

/* ══════════════════════════════════════════════════════════════
   POLISH — micro-interactions & depth (2.0.1)
   ══════════════════════════════════════════════════════════════ */
/* cards lift and catch a little light on hover */
.card{transition:border-color .25s,box-shadow .25s,transform .25s cubic-bezier(.2,.8,.25,1);position:relative}
@media (hover:hover){
  .card:hover{transform:translateY(-2px);border-color:var(--line2);
    box-shadow:0 1px 2px rgba(0,0,0,.45),0 18px 44px rgba(0,0,0,.42)}
  .mode-card:hover{transform:translateY(-2px)}
  .hubcard:hover{transform:translateY(-2px)}
}
.card.glow{overflow:hidden}
.card.glow:before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:radial-gradient(120% 78% at 0% 0%,color-mix(in srgb,var(--a1) 14%,transparent),transparent 62%)}
.card.glow>*{position:relative;z-index:1}

/* hero gets a second light source + a hairline top edge */
.hero{transition:border-color .5s ease,background .5s ease}
.hero:before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(85% 130% at 100% 0%,color-mix(in srgb,var(--a2) 13%,transparent),transparent 62%)}
.hero:after{content:"";position:absolute;top:0;left:12%;right:12%;height:1px;pointer-events:none;
  background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--a2) 55%,transparent),transparent)}
.hero>*{position:relative;z-index:1}

/* stat tiles: hairline accent + hover */
.stat{transition:transform .22s cubic-bezier(.2,.8,.25,1),border-color .22s;position:relative;overflow:hidden}
.stat:before{content:"";position:absolute;top:0;left:24%;right:24%;height:1px;opacity:.55;
  background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--a2) 65%,transparent),transparent)}
@media (hover:hover){.stat:hover{transform:translateY(-2px);border-color:var(--line2)}}

/* solid buttons get a glass sheen */
.btn{position:relative;overflow:hidden}
.btn:not(.ghost):not(.danger){
  background-image:linear-gradient(180deg,rgba(255,255,255,.20),rgba(255,255,255,0) 54%),
    linear-gradient(100deg,color-mix(in srgb,var(--a1) 74%,#fff),color-mix(in srgb,var(--a2) 80%,#fff));
  box-shadow:0 3px 12px color-mix(in srgb,var(--a1) 26%,transparent)}
.btn:not(.ghost):not(.danger):hover{box-shadow:0 6px 18px color-mix(in srgb,var(--a1) 36%,transparent)}
.seg button{position:relative}
.seg button.sel{box-shadow:0 3px 12px color-mix(in srgb,var(--a1) 30%,transparent)}

/* Echo panel: a slow aurora sweep across the header, so the one thing that
   represents the agent feels alive without ever moving layout */
.estatus{position:relative}
.estatus .eh{position:relative;overflow:hidden}
.estatus .eh:before{content:"";position:absolute;inset:-70% -35%;pointer-events:none;
  background:conic-gradient(from 0deg,
    transparent 0deg,
    color-mix(in srgb,var(--a2) 22%,transparent) 55deg,
    transparent 130deg,
    transparent 190deg,
    color-mix(in srgb,var(--a1) 20%,transparent) 250deg,
    transparent 330deg,
    transparent 360deg);
  filter:blur(26px);animation:aurora 18s linear infinite;opacity:.7}
@keyframes aurora{to{transform:rotate(360deg)}}
.estatus .eh>*{position:relative;z-index:1}
.estatus .eorb{box-shadow:0 4px 14px color-mix(in srgb,var(--a1) 40%,transparent),
  inset 0 1px 1px rgba(255,255,255,.42)}
.estatus .eline i{box-shadow:0 0 7px color-mix(in srgb,var(--a2) 70%,transparent)}
.estatus .ecta span:last-child{transition:transform .22s}
.estatus:hover .ecta span:last-child{transform:translateX(4px)}

/* mode cards: glowing icon when live */
.mode-ic{transition:.22s}
.mode-card.on .mode-ic{box-shadow:0 0 20px color-mix(in srgb,var(--a1) 28%,transparent)}

/* chips + log lines */
.chip{transition:.18s}
.log-line{transition:background .2s,border-left-color .2s}
@media (hover:hover){.log-line:hover{background:var(--elev)}}

/* empty states read as an invitation instead of a dead end */
.empty{border:1px dashed var(--line2);border-radius:var(--r);background:
  radial-gradient(120% 100% at 50% 0%,color-mix(in srgb,var(--a1) 7%,transparent),transparent 70%)}

/* the live dot in the title gets a soft ring */
h1 .dot{position:relative}
h1 .dot:after{content:"";position:absolute;inset:-4px;border-radius:50%;
  border:1px solid color-mix(in srgb,var(--a2) 45%,transparent);animation:orbring 3.4s ease-out infinite}

/* progress bars shimmer as they fill */
.conf i{position:relative;overflow:hidden}
.conf i:after{content:"";position:absolute;inset:0;
  background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.42) 50%,transparent 80%);
  animation:shimmer 2.6s ease-in-out infinite}
@keyframes shimmer{0%{transform:translateX(-100%)}60%,100%{transform:translateX(220%)}}

/* the Echo mark breathes while idle — the agent reads as alive without
   ever moving layout (box-shadow only, so it can't fight the hover transform) */
.orb[data-state="idle"]{animation:orbbreath 4.4s ease-in-out infinite}
@keyframes orbbreath{
  0%,100%{box-shadow:0 0 0 4px var(--bg),0 5px 16px color-mix(in srgb,var(--a1) 42%,transparent),
    inset 0 1px 1px rgba(255,255,255,.45)}
  50%{box-shadow:0 0 0 4px var(--bg),0 7px 24px color-mix(in srgb,var(--a1) 66%,transparent),
    inset 0 1px 1px rgba(255,255,255,.45)}}
.orb:hover,.orb:active{animation:none}

/* nav feedback on the inactive tabs too */
@media (hover:hover){nav button:not(.active):hover{color:var(--muted)}
  nav button:not(.active):hover svg{transform:translateY(-1px)}}

/* focus ring that matches the accent */
.estatus:focus-visible,.hubcard:focus-visible,.mode-card:focus-visible{outline:2px solid var(--a2);outline-offset:2px}
</style>
</head>

<script>
"use strict";
/* ════════════════════════════════════════════════════════════════
   EchoOS — AI-powered personal automation layer for Android
   Single-file MVP per SRS v2.0. All device actions are SIMULATED
   and labeled as such (SRS §5, §15). State is in-memory only.
   ════════════════════════════════════════════════════════════════ */

/* ---------- strict catalogs (docs/AI_ACTION_SCHEMA.md) ---------- */
const ACTIONS={
  focus_mode:{sens:0,perm:"dnd"}, dnd_on:{sens:0,perm:"dnd"}, dnd_off:{sens:0,perm:"dnd"},

  calendar_summary:{sens:0,perm:"calendar"}, notify_user:{sens:0,perm:"notifications"},
  set_alarm:{sens:0,perm:null}, brightness:{sens:0,perm:"settings"},
};
const TRIGGERS=["location_enter","location_exit","time_schedule","calendar_event",
  "bluetooth_connect","bluetooth_disconnect","pattern_detected","manual"];

/* ---------- state ---------- */
const S={tab:"home",moreSeg:"hub",theme:"ambient",
  automations:[],commitments:[],patterns:[],events:[],log:[],
  memoryPrefs:[
    {k:"Preferred focus window",v:"09:00–12:00",src:"learned from patterns"},
    {k:"Commute music",v:"Drive Mix playlist",src:"learned from driving routine"},
    {k:"Quiet hours",v:"22:30–06:30",src:"set by you"}],
  caps:{location:1,notifications:1,calendar:1,connectivity:1,dnd:1,messaging:0,settings:1,camera:1},
  plan:null,preview:null,autonomySel:"confirm",activeMode:null,seq:1,listening:false};

const MODES=[
  {id:"college",icon:"🎓",name:"College",trigger:{type:"location_enter",place:"college"},
   tdesc:"Arrive at College (geofence)",actions:[{type:"focus_mode",value:"college"},{type:"silent_mode",enabled:1},{type:"calendar_summary"}]},
  {id:"work",icon:"💼",name:"Work",trigger:{type:"location_enter",place:"work"},
   tdesc:"Arrive at Work (geofence)",actions:[{type:"dnd_on"},{type:"calendar_summary"}]},
  {id:"driving",icon:"🚗",name:"Driving",trigger:{type:"bluetooth_connect",device:"car"},
   tdesc:"Car Bluetooth connects",actions:[{type:"navigation_start",destination:"work"},{type:"play_music"}]},
  {id:"gym",icon:"🏋️",name:"Gym",trigger:{type:"location_enter",place:"gym"},
   tdesc:"Arrive at Gym (geofence)",actions:[{type:"play_music"},{type:"dnd_on"}]},
  {id:"sleep",icon:"🌙",name:"Sleep",trigger:{type:"time_schedule",time:"22:30"},
   tdesc:"Every day at 22:30",actions:[{type:"dnd_on"},{type:"silent_mode",enabled:1},{type:"set_alarm",time:"06:30"}]},
];
const modeState={college:0,work:0,driving:0,gym:0,sleep:0};

/* ════════ AI LAYER (rule-based, mirrors backend services) ════════ */
const PLACES=["college","work","home","gym","office","school","library"];
function parseNL(text){
  const low=text.toLowerCase();
  let place=PLACES.find(p=>new RegExp("\\b"+p+"\\b").test(low));
  if(place==="office")place="work"; if(place==="school")place="college";
  let trigger={type:"manual"};
  const tm=low.match(/\b(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/);
  if(/\b(leave|leaving|exit|depart)\b/.test(low)&&place)trigger={type:"location_exit",place};
  else if(/\b(reach|arrive|arriving|get to|enter)\b/.test(low)&&place)trigger={type:"location_enter",place};
  else if(/\b(car|driving|drive)\b/.test(low))trigger={type:"bluetooth_connect",device:"car"};
  else if(tm){let h=+tm[1]%12;if(tm[3]==="pm")h+=12;
    trigger={type:"time_schedule",time:String(h).padStart(2,"0")+":"+(tm[2]||"00")};}
  else if(/\bevery (day|morning|evening|night)\b|\bdaily\b/.test(low)){
    trigger={type:"time_schedule",time:low.includes("morning")?"07:00":low.includes("evening")?"19:00":
      low.includes("night")?"22:00":"08:00"};}
  else if(place)trigger={type:"location_enter",place};
  const A=[];
  if(/focus|study mode|focus routine/.test(low))A.push({type:"focus_mode",value:place||"focus"});
  if(/\b(silent|silence|mute)\b/.test(low))A.push({type:"silent_mode",enabled:1});
  if(/do not disturb|\bdnd\b/.test(low))A.push({type:"dnd_on"});
  if(/\b(music|playlist|spotify|song)\b/.test(low))A.push({type:"play_music"});
  if(/\b(navigate|navigation|directions|maps)\b/.test(low))A.push({type:"navigation_start",destination:place||"home"});
  if(/\bremind/.test(low)){const m=low.match(/remind (?:me )?(?:to |about )?(.+?)(?: at \d|$)/);
    A.push({type:"create_reminder",title:m?m[1].trim():"Reminder"});}
  if(/\balarm\b|wake me/.test(low))A.push({type:"set_alarm",time:trigger.time||"07:00"});
  if(/\b(text|message|whatsapp|tell)\b/.test(low)){
    const m=text.match(/\b(?:text|message|tell)\s+([A-Za-z]+)/i);
    A.push({type:"send_message",to:(m&&!["me","my","the"].includes(m[1].toLowerCase()))?m[1]:"contact"});}
  if(/\b(calendar|schedule|agenda|my day)\b/.test(low))A.push({type:"calendar_summary"});
  if(/\bwifi\b/.test(low))A.push({type:"wifi_toggle",enabled:!/\b(off|disable)\b/.test(low)});
  if(!A.length&&/\broutine\b/.test(low)){A.push({type:"focus_mode",value:place||"routine"});
    A.push({type:"calendar_summary"});}
  return{trigger,actions:A,confidence:(trigger.type!=="manual"&&A.length)?0.9:A.length?0.6:0.2,requires_confirmation:1};
}
/* FR-03 — nothing outside the catalog can ever execute */
function validateIntent(raw){
  if(!TRIGGERS.includes(raw.trigger.type))return{valid:0,reason:"Unsupported trigger '"+raw.trigger.type+"'"};
  const rejected=raw.actions.filter(a=>!ACTIONS[a.type]).map(a=>a.type);
  const kept=raw.actions.filter(a=>ACTIONS[a.type]).slice(0,5);
  if(!kept.length)return{valid:0,reason:"No supported actions recognized",rejected};
  const perms=new Set();
  if(TRIG_PERM[raw.trigger.type])perms.add(TRIG_PERM[raw.trigger.type]);
  kept.forEach(a=>{if(ACTIONS[a.type].perm)perms.add(ACTIONS[a.type].perm);});
  const sens=kept.some(a=>ACTIONS[a.type].sens),c=Math.max(0,Math.min(1,raw.confidence));
  return{valid:1,rejected,intent:{trigger:raw.trigger,actions:kept,required_permissions:[...perms].sort(),
    requires_confirmation:!!(raw.requires_confirmation||sens||c<0.4),confidence:c,summary:summarize(raw.trigger,kept)}};
}
function summarize(tr,A){
  const t={location_enter:"When you arrive at "+(tr.place||"?"),location_exit:"When you leave "+(tr.place||"?"),
    time_schedule:"Every day at "+(tr.time||"?"),bluetooth_connect:"When your "+(tr.device||"car")+" connects",
    calendar_event:"Around your "+(tr.match||"event"),manual:"On demand"}[tr.type]||"When triggered";
  return t+": "+A.map(a=>a.type.replace(/_/g," ")).join(", ")+".";
}
/* EchoLens — FR-06..08 */
function extractCommitment(item){
  const low=item.text.toLowerCase();
  const pats=[[/i(?:'|’)?ll\s+(.+)/,.85],[/\bi will\s+(.+)/,.85],[/can you\s+(.+?)\??$/,.85],
    [/could you\s+(.+?)\??$/,.85],[/don'?t forget to\s+(.+)/,.75],[/reminder:?\s+(.+)/,.7],
    [/\b(?:need|have)\s+to\s+(.+)/,.7],[/\bsubmit\s+(.+)/,.7]];
  let task=null,conf=0;
  for(const[p,c]of pats){const m=low.match(p);if(m){task=m[1];conf=c;break;}}
  if(!task)return null;
  task=task.replace(/\bby\s+(tomorrow|today|tonight|monday|tuesday|wednesday|thursday|friday|saturday|sunday|next week|eod).*$/,"")
    .replace(/[.!?,\s]+$/,"");
  if(task.length<3)return null;
  const today=new Date();let dl=null;
  const D=["sunday","monday","tuesday","wednesday","thursday","friday","saturday"];
  if(/tomorrow/.test(low)){dl=new Date(today);dl.setDate(dl.getDate()+1);}
  else if(/today|tonight|eod/.test(low))dl=new Date(today);
  else for(let i=0;i<7;i++)if(new RegExp("\\b(?:by |on |before )?"+D[i]+"\\b").test(low)){
    dl=new Date(today);dl.setDate(dl.getDate()+(((i-today.getDay())%7)||7));break;}
  let dls=null;
  if(dl){let h=18,mi=0;const t2=low.match(/(?:by|at|before)\s+(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/);
    if(t2){h=(+t2[1]%12)+(t2[3]==="pm"?12:0);mi=+(t2[2]||0);}else if(/tonight/.test(low))h=20;
    dl.setHours(h,mi,0,0);
    dls=dl.toLocaleDateString([],{weekday:"short",day:"numeric",month:"short"})+" "+
      dl.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});conf=Math.min(.95,conf+.1);}
  return{task,person:item.sender||null,deadline:dls,confidence:conf,raw:item.text};
}
function classify(item,hasC){
  const low=item.text.toLowerCase();
  if(/(sale|offer|% off|new video|subscribed|promo|cashback)/.test(low))return"low";
  if(hasC||/(urgent|asap|today|deadline|due|otp|payment|exam|meeting)/.test(low))return"needs_attention";
  if(["whatsapp","sms","email","slack"].includes(item.source))return"later";
  return"low";
}
/* Pattern detection — FR-09 */
function detectPatterns(){
  const anchors={};let cur=null;
  for(const e of S.events.slice().reverse()){
    const key=e.type+(e.value?":"+e.value:"");
    if(["bluetooth_connect","location_enter","location_exit"].includes(e.type)){
      cur={anchor:key,follow:new Set()};(anchors[key]=anchors[key]||[]).push(cur);}
    else if(cur&&["open_app","play_music","navigation_start","dnd_on","silent_mode","focus_mode"].includes(e.type))
      cur.follow.add(key);
  }
  const found=[];
  for(const[anchor,sess]of Object.entries(anchors)){
    const wf=sess.filter(s=>s.follow.size); if(wf.length<3)continue;
    const counts={};wf.forEach(s=>{const k=[...s.follow].sort().join("|");counts[k]=(counts[k]||0)+1;});
    const[best,freq]=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0]; if(freq<3)continue;
    const follow=best.split("|"),conf=Math.min(.95,.5+.1*freq),[aT,aV]=anchor.split(":");
    const trigger={type:aT}; if(aT.startsWith("location"))trigger.place=aV;else trigger.device=aV||"car";
    const actions=follow.map(f=>{const[t,v]=f.split(":");
      return t==="open_app"?{type:"open_app",app_name:v}:t==="play_music"?{type:"play_music",playlist:v}:{type:t};});
    const human=aT==="bluetooth_connect"?"your "+(aV||"car")+" connects":
      aT==="location_enter"?"you arrive at "+aV:"you leave "+aV;
    found.push({anchor,freq,conf,trigger,actions,
      summary:"You did this "+freq+" times: when "+human+", you "+
        follow.map(f=>f.replace(/_/g," ").replace(":"," → ")).join(", ")+". Automate it?"});
  }
  return found;
}
/* Planner — FR-10 */
const toMin=s=>{const[a,b]=s.split(":");return +a*60+ +b;};
const toHH=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
function buildPlan(){
  const fixed=demoCalendar.map(c=>({...c,kind:"fixed",src:"calendar",editable:0}));
  const blocks=[...fixed],busy=fixed.map(f=>[toMin(f.start),toMin(f.end)]);
  const lunch=[toMin("13:00"),toMin("13:40")];
  if(busy.every(([s,e])=>e<=lunch[0]||s>=lunch[1])){
    blocks.push({title:"Lunch",start:"13:00",end:"13:40",kind:"break",src:"planner",editable:1});busy.push(lunch);}
  const work=[];
  S.commitments.filter(c=>c.status==="accepted").forEach(c=>work.push({title:c.task,min:45,kind:"commitment",dl:c.deadline}));
  demoTasks.slice().sort((a,b)=>a.pri-b.pri).forEach(t=>work.push({title:t.title,min:t.est,kind:"task"}));
  const notes=[];let cur=toMin("08:00"),sinceBreak=0;const end=toMin("22:00");
  for(const w of work){let placed=0;
    while(cur+w.min<=end){
      const clash=busy.find(([s,e])=>cur<e&&s<cur+w.min);
      if(clash){cur=clash[1];continue;}
      if(sinceBreak>=120){blocks.push({title:"Break",start:toHH(cur),end:toHH(cur+15),kind:"break",src:"planner",editable:1});
        busy.push([cur,cur+15]);cur+=15;sinceBreak=0;continue;}
      blocks.push({title:w.title,start:toHH(cur),end:toHH(cur+w.min),kind:w.kind,src:"planner",editable:1});
      if(w.dl)notes.push("'"+w.title+"' scheduled at "+toHH(cur)+" (deadline "+w.dl+").");
      busy.push([cur,cur+w.min]);cur+=w.min;sinceBreak+=w.min;placed=1;break;}
    if(!placed)notes.push("Not enough time for '"+w.title+"' — rolls over to tomorrow.");}
  blocks.sort((a,b)=>toMin(a.start)-toMin(b.start));
  const d=new Date();d.setDate(d.getDate()+1);
  return{date:d.toLocaleDateString([],{weekday:"long",day:"numeric",month:"short"}),blocks,notes};
}

/* ════════ AUTOMATION ENGINE (SRS §10 safety flow) ════════ */
function fireContext(type,value,meta){
  const real=!!(meta&&meta.real);
  S.events.unshift({t:now(),type,value,sim:!real});
  log(real?"ok":"info","Context event: "+type+(value?" ("+value+")":"")+
    (real?" [REAL DEVICE]":" [SIMULATED]"),!real);
  for(const a of S.automations){
    if(a.status!=="active"||!triggerMatches(a.intent.trigger,type,value))continue;
    const missing=a.intent.required_permissions.filter(p=>!S.caps[p]);
    const why="Trigger '"+type+(value?":"+value:"")+"' matched '"+a.name+"'. ";
    if(missing.length){log("err",why+"BLOCKED — data source disabled: "+missing.join(", ")+". Enable it in Control.");continue;}
    const sens=a.intent.actions.some(x=>ACTIONS[x.type].sens);
    if(a.autonomy==="suggest"){a.status="pending";
      log("sug",why+"Autonomy is Suggest — EchoOS only recommends. Approve on Home.");continue;}
    if(a.autonomy==="confirm"||sens){a.status="pending";
      log("sug",why+(sens?"Sensitive action — ":"Autonomy is Confirm — ")+"waiting for your approval.");
      toast("⏸ <b>"+esc(a.name)+"</b> wants to run — approve on Home");continue;}
    executeAutomation(a,why+"Pre-approved (Automatic).");
  }
  for(const m of MODES)if(triggerMatches(m.trigger,type,value))
    activateMode(m.id,"Context event '"+type+"' matched "+m.name+" Mode.");
  persist(); render();
}
function triggerMatches(tr,type,value){
  if(tr.type!==type)return false;
  if(type.startsWith("location"))return !tr.place||tr.place===(value||"").toLowerCase();
  if(type.startsWith("bluetooth"))return !tr.device||(value||"").toLowerCase().includes(tr.device);
  if(type==="time_schedule")return tr.time===value;
  return true;
}
function executeAutomation(a,why){
  let ok=true;
  for(const act of a.intent.actions){
    const r=performAction(act); ok=ok&&r;
    const realAct=actionIsReal(act.type);
    log(r?"ok":"err",why+" Action '"+act.type+"' "+(realAct?"[REAL]":"[SIMULATED]")+" "+
      (r?"completed.":"FAILED — not reported as success."),!realAct);
  }
  a.status="active";a.lastRun=now();
  if(a.intent.actions.some(x=>x.type==="focus_mode")){
    S.activeMode=a.intent.trigger.place||a.intent.trigger.device||"Focus";showMode();}
  if(ok){burst();chord();}
  toast((ok?"✅ ":"⚠️ ")+"<b>"+esc(a.name)+"</b> "+(ok?"executed":"finished with failures")+" · History shows why");
}
/* Which catalogue actions a browser can genuinely perform (spec §58). */
const ACTION_REALITY={
  notify_user:"real", create_reminder:"real", calendar_summary:"real",
  navigation_start:"real", send_message:"handoff",
  focus_mode:"sim", dnd_on:"sim", dnd_off:"sim", silent_mode:"sim",
  wifi_toggle:"sim", bluetooth_toggle:"sim", brightness:"sim",
  open_app:"sim", play_music:"sim", set_alarm:"sim",
};
function actionIsReal(t){return ACTION_REALITY[t]==="real"||ACTION_REALITY[t]==="handoff";}
function performAction(act){
  const mode=ACTION_REALITY[act.type]||"sim";
  if(mode==="real"){
    if(act.type==="navigation_start"){
      const dest=encodeURIComponent(act.params&&act.params.destination||"home");
      window.open("https://www.google.com/maps/dir/?api=1&destination="+dest,"_blank","noopener");
      return true;
    }
    const title={notify_user:"EchoOS",create_reminder:"Reminder",
      calendar_summary:"Today"}[act.type]||"EchoOS";
    const body=act.type==="calendar_summary"
      ? demoCalendar.map(c=>c.start+" "+c.title).join(" · ")
      : (act.params&&(act.params.title||act.params.text))||"Automation ran";
    const sent=DEVICE.notify(title,body);
    if(!sent)toast(esc(title)+" · "+esc(body)+" <span class=\"dim\">(notification permission off)</span>");
    return true;
  }
  if(mode==="handoff"){
    if(navigator.share){
      navigator.share({title:"EchoOS",text:(act.params&&act.params.text)||"Sent from EchoOS"})
        .catch(()=>{});
      return true;
    }
    toast("Sharing isn't available here — nothing was sent.");
    return false;
  }
  return true;   // simulated, and labelled as such wherever it is reported
}
function showMode(){
  const b=$("mode-banner"),on=MODES.filter(m=>modeState[m.id]).map(m=>m.icon+" "+m.name.toUpperCase());
  if(S.activeMode&&!on.length)on.push("● "+S.activeMode.toUpperCase());
  if(on.length){b.style.display="block";b.textContent=on.join(" · ")+" MODE ACTIVE [SIMULATED]";}
  else b.style.display="none";
}
/* Context Modes — SRS §9.6 */
function modePerms(m){const p=new Set();
  if(TRIG_PERM[m.trigger.type])p.add(TRIG_PERM[m.trigger.type]);
  m.actions.forEach(a=>{if(ACTIONS[a.type].perm)p.add(ACTIONS[a.type].perm);});return[...p].sort();}
function activateMode(id,why){
  const m=MODES.find(x=>x.id===id); if(!m||modeState[id])return;
  const missing=modePerms(m).filter(p=>!S.caps[p]);
  if(missing.length){log("err",(why||"")+" "+m.name+" Mode BLOCKED — data source disabled: "+missing.join(", ")+".");
    toast("⛔ "+m.name+" Mode blocked — enable "+missing.join(", ")+" in Control");render();return;}
  const lvl=modeAutonomy[id];
  if(lvl==="suggest"){log("sug",(why||"")+" EchoOS suggests "+m.name+" Mode (autonomy: Suggest). Activate it on the Modes tab.");
    toast("💡 Suggestion: activate "+m.name+" Mode?");render();return;}
  if(lvl==="confirm"&&!(why||"").startsWith("User")){
    log("sug",(why||"")+" "+m.name+" Mode waits for confirmation (autonomy: Confirm).");
    toast("⏸ "+m.name+" Mode is ready — confirm on the Modes tab");render();return;}
  modeState[id]=1;
  runModeActions(m,why||"");
  showMode();burst();persist();toast(m.icon+" <b>"+m.name+" Mode</b> activated");render();
}
/** Runs a mode's actions for real where the browser can, simulated where it cannot. */
function runModeActions(m,why){
  let allOk=true;
  m.actions.forEach(a=>{
    let ok=false;
    try{ ok=performAction(a); }catch(e){ ok=false; }
    allOk=allOk&&ok;
    const real=actionIsReal(a.type);
    log(ok?"ok":"err",why+" "+m.name+" Mode → action '"+a.type+"' "+
      (real?"[REAL]":"[SIMULATED]")+" "+(ok?"completed.":"FAILED — not reported as success."),!real);
  });
  return allOk;
}
function userToggleMode(id){
  const m=MODES.find(x=>x.id===id); if(!m)return;
  if(modeState[id]){modeState[id]=0;
    log("info","User deactivated "+m.name+" Mode. Reversible actions restored.");
    showMode();persist();render();return;}
  const missing=modePerms(m).filter(p=>!S.caps[p]);
  if(missing.length){log("err","User tried "+m.name+" Mode — BLOCKED, data source disabled: "+missing.join(", ")+".");
    toast("⛔ Blocked — enable "+missing.join(", ")+" in Control");render();return;}
  modeState[id]=1;
  m.actions.forEach(a=>log("ok","User activated "+m.name+" Mode → '"+a.type+"' [SIMULATED] completed.",1));
  showMode();burst();persist();toast(m.icon+" <b>"+m.name+" Mode</b> activated");render();
}
function setModeAutonomy(id,l){modeAutonomy[id]=l;persist();
  log("info",MODES.find(m=>m.id===id).name+" Mode autonomy set to "+l+" by user.");render();}

/* 1 · confetti celebration */
function burst(){
  const c=$("confetti"),ctx=c.getContext("2d");
  c.width=innerWidth;c.height=innerHeight;c.style.display="block";
  const cols=["#A78BFA","#7DD3FC","#FDA4C7","#A7E8C5","#FDE68A","#FBBF9B"];
  const P=Array.from({length:70},()=>({x:innerWidth/2+(Math.random()-.5)*140,y:innerHeight*.42,
    vx:(Math.random()-.5)*7,vy:Math.random()*-9-2,w:5+Math.random()*6,h:4+Math.random()*5,
    r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[(Math.random()*cols.length)|0],life:70+Math.random()*40}));
  let f=0;
  (function tick(){
    ctx.clearRect(0,0,c.width,c.height);let alive=0;
    for(const p of P){
      if(p.life<=0)continue; alive++;
      p.vy+=.28;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life--;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.globalAlpha=Math.min(1,p.life/28);
      ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();
    }
    if(alive&&f++<160)requestAnimationFrame(tick);
    else{ctx.clearRect(0,0,c.width,c.height);c.style.display="none";}
  })();
}

function startVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast("🎙 Voice needs Chrome/Edge over http(s) — type it instead");return;}
  const r=new SR();r.lang="en-IN";r.interimResults=false;r.maxAlternatives=1;
  S.listening=true;render();
  r.onresult=e=>{const t=e.results[0][0].transcript;const box=$("nl");
    if(box){box.value=t;} S.listening=false;render();
    if($("nl"))$("nl").value=t;
    toast("🎙 Heard: “"+esc(t)+"”");doParse();};
  r.onerror=()=>{S.listening=false;render();toast("🎙 Didn't catch that — try again or type it");};
  r.onend=()=>{if(S.listening){S.listening=false;render();}};
  try{r.start();toast("🎙 Listening… say your automation");}catch(e){S.listening=false;render();}
}
